<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OBS Remote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OBS Remote</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1f2630; --line:#2a323d; --text:#e6edf3; --dim:#8b949e;
  --blue:#2f81f7; --red:#e5484d; --green:#2ea043; --amber:#d29922;
  --r:14px; --gap:10px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding:calc(var(--safe-t) + 0px) 0 calc(68px + var(--safe-b))}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.4}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px;height:52px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.dot.ok{background:var(--green)} .dot.wait{background:var(--amber)}
.title{font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--panel2);border:1px solid var(--line)}
.pill.live{background:var(--red);border-color:var(--red);color:#fff}
.pill.rec{background:#7a1d20;border-color:var(--red);color:#fff}
.pill .b{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7}
.icon-btn{padding:8px 10px;border-radius:10px;background:transparent;border:none;font-size:20px;line-height:1;display:flex;color:var(--dim)}
.icon-btn svg{width:22px;height:22px}
/* icons inside buttons and labels: sized to the text, a little gap before the words */
.ic{display:inline-flex;flex:none;font-style:normal;line-height:0}
.ic svg,.lbl svg{width:1.2em;height:1.2em;flex:none}
.lbl{display:inline-flex;align-items:center;justify-content:center;gap:.45em}
.icon-btn.badge{position:relative}.icon-btn.badge::after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.upd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.upd span{font-size:13px;color:var(--dim)}.upd b{color:var(--text,inherit)}.upd button{padding:8px 12px;white-space:nowrap}
section{margin:12px 0}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:16px 2px 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
h2 button{font-size:12px;padding:4px 8px;text-transform:none;letter-spacing:0}
/* the picture stays pinned under the header while the page scrolls (presets, scenes, audio) */
.stick{position:sticky;top:52px;z-index:4;background:var(--bg);margin:0 -12px;padding:var(--gap) 12px;box-shadow:0 10px 12px -12px #000}
.stick .mon{max-height:42vh;max-height:42dvh}
.stick .camview{margin-top:0}
#camMon{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#camMon img{-webkit-user-drag:none;pointer-events:none}
#camMon{will-change:transform}
#tabCam .stick{overflow:hidden}  /* the picture slides within its strip */
.peek{position:absolute;top:50%;transform:translateY(-50%);font-weight:700;font-size:15px;color:var(--text);opacity:0;pointer-events:none;white-space:nowrap}
.peek.r{right:24px}.peek.l{left:24px}  /* sideways swipes switch camera (see selectCam), up/down still scrolls */
/* hints that the picture swipes: an arrow each side (also tappable) and a dot per camera under it */
.camnav{position:absolute;top:18%;bottom:18%;width:52px;z-index:2;padding:0;border:0;border-radius:0;color:#fff;opacity:.9;
  display:flex;align-items:center;justify-content:center;background:none;-webkit-tap-highlight-color:transparent;
  transition:opacity .6s,transform .15s}
.camnav.l{left:-14px}.camnav.r{right:-14px}
.camnav svg{width:28px;height:28px;filter:drop-shadow(0 0 2px #000a) drop-shadow(0 1px 1px #0008)}  /* just a thin outline: readable on bright pictures */
.camview.idle .camnav{opacity:.28}  /* fade back after a few seconds untouched; any touch on the picture brings them back */
.camnav:active{opacity:1;transform:scale(.85);transition:none}.camnav[hidden]{display:none}
@media (max-height:500px){.stick{position:static;box-shadow:none}}  /* phone on its side: no room to pin it */
.monitors{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.monitors.single{grid-template-columns:1fr}
.mon{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9;border:2px solid var(--line)}
.mon img{width:100%;height:100%;object-fit:contain;display:block}
.mon img:not([src]){visibility:hidden}  /* cleared picture (camera switched/offline): no broken-image icon */
.mon .lab{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:#000a}
.mon .fps{position:absolute;right:6px;top:6px;font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;background:#000a;color:#fffb;font-variant-numeric:tabular-nums}
.mon .fps:empty{display:none}
.field select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.mon.pgm{border-color:var(--red)} .mon.pgm .lab{background:var(--red)}
.mon.pvw{border-color:var(--green)} .mon.pvw .lab{background:var(--green)}
.mon .name{position:absolute;left:6px;bottom:6px;right:6px;font-size:12px;font-weight:600;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take{display:grid;grid-template-columns:1fr;margin-top:var(--gap)}
.take button{padding:14px;font-weight:700}
#btnTake{background:var(--red);border-color:var(--red);color:#fff;font-size:17px}
.take button{display:flex;flex-direction:column;align-items:center;gap:1px}
.take button small{font-size:11px;font-weight:500;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--gap)}
.scene{min-height:60px;font-weight:600;text-align:left;position:relative;padding:12px 12px 12px 14px;word-break:break-word}
.scene.pgm{background:#3b1416;border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.scene.pvw{background:#122a19;border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}
.scene.pgm.pvw{box-shadow:inset 4px 0 0 var(--red),inset -4px 0 0 var(--green)}
.outputs{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.outputs button{padding:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.outputs button small{font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
.outputs button.on{background:var(--red);border-color:var(--red);color:#fff}
.outputs button.on small{color:#fffc}
/* Advanced Scene Switcher on/off (only shown when OBS has the plugin) */
.assrow{display:flex;align-items:center;gap:12px;margin-top:var(--gap);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.assrow[hidden]{display:none}
.assrow>span{flex:1;font-weight:600;display:flex;flex-direction:column;gap:2px}
.assrow small{font-size:12px;font-weight:500;color:var(--dim)}
.assrow .asi svg{width:20px;height:20px;color:var(--dim)}
#btnAss{position:relative;width:54px;height:32px;padding:0;border-radius:999px;flex:none;transition:background .15s}
#btnAss span{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#c9d1d9;transition:transform .15s}
#btnAss.on{background:var(--green);border-color:var(--green)}
#btnAss.on span{transform:translateX(22px);background:#fff}
.stats{font-size:12px;color:var(--dim);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.audio{display:flex;flex-direction:column;gap:8px}
.arow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.ainfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.atop{display:flex;align-items:baseline;gap:8px}
.arow .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .db{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.meter{display:flex;flex-direction:column;gap:2px}
/* -60..0 dB, OBS colours: green to -20 dB, yellow to -9 dB, red above */
.mbar{position:relative;height:6px;border-radius:3px;overflow:hidden;background:linear-gradient(to right,#2ea043 0 66.7%,#d29922 66.7% 85%,#e5484d 85%)}
.mbar .cv{position:absolute;inset:0;background:#0d1117;transform-origin:right;transform:scaleX(1)}
.mbar .hd{position:absolute;top:0;bottom:0;width:2px;margin-left:-2px;left:0;background:#fff;opacity:0}
.meter.muted .mbar{filter:grayscale(1);opacity:.45}
.meter.idle .mbar{opacity:.35}
.arow button{min-width:88px;padding:9px}
.arow button.muted{background:#3b1416;border-color:var(--red);color:#ffb3b5}
.arow button[data-mute]{display:flex;align-items:center;justify-content:center;gap:6px}
.arow button[data-mute] svg{width:18px;height:18px;flex:none}
/* listen on the phone (Settings → Live tab → Listen) */
.arow button.amon{min-width:0;width:44px;height:40px;flex:none;padding:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.arow button.amon svg{display:block;flex:none;width:20px;height:20px}
.arow button.amon.on{background:#10273f;border-color:#2f81f7;color:#9ecbff}
h2 .hbtns{display:flex;gap:6px}
#btnListen{display:flex;align-items:center;gap:5px}
#btnListen[hidden]{display:none}
#btnListen svg{width:14px;height:14px}
#btnListen.on{background:#2f81f7;border-color:#2f81f7;color:#fff}
/* camera tab */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;--fl:0px;--fr:0px;
  /* fade an edge while more cameras are hidden past it (see camFade), so the row reads as scrollable */
  -webkit-mask-image:linear-gradient(to right,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);
          mask-image:linear-gradient(to right,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;font-weight:600}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
/* the chips row doubles as the page indicator for the swipeable picture: a highlight slides to the camera shown */
#cams{position:relative}
#cams .chip{position:relative;z-index:1;transition:color .25s}
#cams .chip.sel{background:transparent;border-color:transparent}
#camList{display:flex;gap:8px}
#cams .ind[hidden]{display:none}
#cams .ind{position:absolute;z-index:0;border-radius:999px;background:var(--blue);pointer-events:none;
  transition:left .3s cubic-bezier(.2,.8,.2,1),width .3s cubic-bezier(.2,.8,.2,1)}
.chip .dot{width:8px;height:8px}
/* top-right corner of the camera picture: LIVE pill (camera is in the program) next to the fps count */
.mon .tr{position:absolute;right:6px;top:6px;display:flex;gap:4px;align-items:center}
.mon .tr .fps{position:static}
.onair{display:none;font-size:10px;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:var(--red);color:#fff;align-items:center;gap:4px}
.onair::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.onair.show{display:flex}
.camview{margin-top:var(--gap)}
.ctl{display:grid;grid-template-columns:1fr 92px;gap:var(--gap);margin-top:var(--gap);align-items:stretch}
.pad{position:relative;aspect-ratio:1;max-width:300px;width:100%;align-self:center;margin:0 auto;border-radius:50%;background:radial-gradient(circle,var(--panel2) 0 30%,var(--panel) 31% 100%);border:1px solid var(--line);touch-action:pan-y}
.pad::before,.pad::after{content:"";position:absolute;background:var(--line)}
.pad::before{left:50%;top:10%;bottom:10%;width:1px}
.pad::after{top:50%;left:10%;right:10%;height:1px}
.knob{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:var(--blue);box-shadow:0 4px 14px #0008;transition:transform .12s;pointer-events:none;z-index:1}
.pad.active .knob{transition:none}
/* direction buttons (default) — the joystick is the alternative, Settings → Cameras → Controls */
.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;aspect-ratio:1;max-width:300px;width:100%;margin:0 auto;align-self:center}
.dpad button,.side button,#focusRow button{touch-action:pan-y}  /* swipe over them to scroll (see holdButton) */
.dpad button{padding:0;display:flex;align-items:center;justify-content:center;border-radius:14px}
.dpad button svg{width:30px;height:30px;transform:rotate(var(--r))}
.dpad button.diag{background:var(--panel);color:var(--dim)}
.dpad button.diag svg{width:24px;height:24px}
.dpad button.held{background:var(--blue);border-color:var(--blue);color:#fff}
.dpad .mid{background:#3b1416;border-color:var(--red);color:#ffb3b5;font-size:20px}
.dpad .mid svg{width:22px;height:22px;transform:none}
.side{display:flex;flex-direction:column;gap:var(--gap)}
.side button{flex:1;font-size:22px;font-weight:700;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.side button svg{width:26px;height:26px}
.side small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.row{display:flex;gap:var(--gap);margin-top:var(--gap);align-items:center}
.row button{flex:1;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.row button svg{width:18px;height:18px;flex:none}
#focusRow button{white-space:nowrap;padding-left:8px;padding-right:8px}
#btnStop{background:#3b1416;border-color:var(--red);color:#ffb3b5}
#btnRefresh{background:#33270b;border-color:var(--amber);color:#f2cc72}
.speed{display:flex;align-items:center;gap:10px;margin-top:var(--gap);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.speed input{flex:1;accent-color:var(--blue);pointer-events:none}  /* driven by the row's own drag handler */
.speed{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.speed span{min-width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.speed .spl{display:flex;align-items:center;gap:7px;text-align:left;min-width:0;color:var(--text)}
.speed .spl svg{width:18px;height:18px;color:var(--dim)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.preset{padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;border-radius:10px}
.preset .th{aspect-ratio:16/9;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:22px;font-weight:700}
.preset .pn{padding:6px 8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset.hit{outline:2px solid var(--blue)}
.empty{color:var(--dim);font-size:13px;padding:10px 2px}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav .wrap{display:grid;grid-template-columns:1fr 1fr;height:64px}
nav button{background:none;border:none;border-radius:0;color:var(--dim);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}
nav button .ic svg{width:24px;height:24px}
nav .ic{line-height:0}
nav button.sel{color:var(--blue)}
.tab{display:none} .tab.sel{display:block}
/* sheets */
.scrim{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--panel);border-radius:18px 18px 0 0;border:1px solid var(--line);padding:18px 16px calc(18px + var(--safe-b));
  /* the sheet scrolls itself: on a phone the settings (scenes + cameras) are taller than the screen */
  max-height:calc(100vh - 24px - var(--safe-t));max-height:calc(100dvh - 24px - var(--safe-t));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet .btns{position:sticky;bottom:calc(-18px - var(--safe-b));margin:0 -16px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--dim);white-space:pre-line}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.sheet .btns.one{grid-template-columns:1fr}
.sheet .danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.sheet .primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
/* settings groups */
details.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--bg)}
details.grp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 40px 12px 12px;position:relative}
details.grp summary>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.gi{flex:none;width:34px;height:34px;border-radius:9px;background:#1f6feb26;color:var(--blue);display:flex;align-items:center;justify-content:center;font-style:normal}
.gi svg{width:19px;height:19px}
.sub{font-size:12px;color:var(--dim);font-weight:600;margin:14px 0 8px;display:flex;justify-content:space-between}
.note{font-size:12px;color:var(--dim);margin:8px 0 4px}
/* shown while OBS is closed or not answering (Start OBS: server.py /api/obs/start) */
.down{display:flex;align-items:center;gap:12px;margin:10px 0 0;padding:12px;border-radius:12px;background:#2a1d0c;border:1px solid #9e6a03}
.down[hidden]{display:none}
.down span{flex:1;display:flex;flex-direction:column;gap:2px}
.down small{font-size:12px;color:var(--dim)}
.down button{flex:none;background:var(--green);border-color:var(--green);color:#fff;font-weight:700;padding:10px 14px;display:flex;align-items:center;gap:6px}
.down button svg{width:18px;height:18px}
.down button[hidden]{display:none}
/* picture quality: three tiles */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.two{grid-template-columns:1fr 1fr;margin-bottom:12px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;text-align:center}
.seg svg{width:22px;height:22px;color:var(--dim);margin-bottom:2px}
.seg b{font-size:13px}.seg small{font-size:11px;color:var(--dim)}
.seg input:checked+span{border-color:var(--blue);background:#1f6feb22;box-shadow:inset 0 0 0 1px var(--blue)}
.seg input:checked+span svg{color:var(--blue)}
/* on/off rows */
.tog{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);margin-top:12px;cursor:pointer}
.tog+.tog{margin-top:0}
.tog>span{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tog small{font-size:12px;color:var(--dim)}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#c9d1d9;transition:transform .15s}
.sw:checked{background:var(--green);border-color:var(--green)}
.sw:checked::after{transform:translateX(18px);background:#fff}
/* scenes: eye on = shown on the phone */
.scns{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:40vh;overflow:auto}
.scn{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;min-width:0}
.scn input{position:absolute;opacity:0;pointer-events:none}
.scn svg{width:18px;height:18px;flex:none;display:block}
.scn .on{color:var(--green)}.scn .off{display:none;color:var(--dim)}
.scn .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scn:has(input:not(:checked)){background:transparent;border-style:dashed}
.scn:has(input:not(:checked)) .on{display:none}.scn:has(input:not(:checked)) .off{display:block}
.scn:has(input:not(:checked)) .nm{color:var(--dim);text-decoration:line-through}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-6px;border:solid var(--dim);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}
details.grp[open] summary::after{transform:rotate(-135deg);margin-top:-2px}
details.grp summary span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.grp .grpb{padding:2px 14px 6px;border-top:1px solid var(--line)}
details.grp .grpb>.field:first-child,details.grp .grpb>div:first-child{margin-top:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.camrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.camrow .field{min-width:0}.camrow select{width:100%}
.field label{font-size:12px;color:var(--dim)}
.field input,.field textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.field textarea{resize:vertical;min-height:72px}
.ytrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ytrow .field{min-width:0}.ytrow select{width:100%}
.check{display:flex;align-items:center;gap:10px;padding:8px 0}
.check input{width:20px;height:20px;accent-color:var(--blue)}
.hidelist{max-height:30vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 12px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%);background:#30363d;color:var(--text);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.toast.err{background:#5c1a1d}
</style>
</head>

        <button class="camnav l" id="camPrev" aria-label="Previous camera" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><button class="camnav r" id="camNext" aria-label="Next camera" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
    </div>

<script>
"use strict";
// Installable app: browsers only allow service workers (and so the "Install app" option) on https:// pages and on
// localhost, not on plain http://192.168... addresses. Where that rule allows it, register one.
if("serviceWorker" in navigator&&isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
/* ---------- SHA-256 (crypto.subtle is unavailable on plain http:// LAN pages) ---------- */
function sha256(msg){
  const K=[],H=[];
  for(let n=2,c=0;c<64;n++){let p=true;for(let f=2;f*f<=n;f++)if(n%f===0){p=false;break}
    if(p){const fr=x=>((x-Math.floor(x))*4294967296)|0;if(c<8)H[c]=fr(Math.pow(n,1/2));K[c++]=fr(Math.pow(n,1/3))}}
  const l=msg.length,bl=((l+9+63)>>6)<<6,b=new Uint8Array(bl);b.set(msg);b[l]=0x80;
  const dv=new DataView(b.buffer);dv.setUint32(bl-4,(l*8)>>>0);dv.setUint32(bl-8,Math.floor(l*8/4294967296));
  const W=new Int32Array(64);
  for(let i=0;i<bl;i+=64){
    for(let t=0;t<16;t++)W[t]=dv.getInt32(i+t*4);
    for(let t=16;t<64;t++){const x=W[t-15],y=W[t-2];
      W[t]=(W[t-16]+((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+W[t-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10)))|0}
    let[a,bb,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const t1=(h+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&f)^(~e&g))+K[t]+W[t])|0;
      const t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&bb)^(a&c)^(bb&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  const out=new Uint8Array(32),ov=new DataView(out.buffer);H.forEach((v,i)=>ov.setInt32(i*4,v));return out}
const b64=u8=>btoa(String.fromCharCode(...u8));
const sha64=s=>b64(sha256(new TextEncoder().encode(s)));

/* ---------- obs-websocket v5 client ---------- */
class OBS{
  constructor(){this.ws=null;this.id=0;this.pending=new Map();this.handlers={};this.ready=false;this.subs=1|4|8|16|64|512|1024|(1<<16)}
  // Subscriptions are set once, at login. Never change them with op 3 (Reidentify): obs-websocket 5.x
  // miscounts its volume-meter listeners when a Reidentify arrives as the connection closes (a phone
  // locking does exactly that). Each miss lowers the count for good, and once it's low enough OBS stops
  // sending levels to every client until OBS restarts.
  on(ev,fn){(this.handlers[ev]??=[]).push(fn)}
  off(ev,fn){this.handlers[ev]=(this.handlers[ev]||[]).filter(f=>f!==fn)}
  emit(ev,d){(this.handlers[ev]||[]).forEach(f=>{try{f(d)}catch(e){console.error(e)}})}
  connect(url,password){
    this.close();
    return new Promise((resolve,reject)=>{
      let ws;try{ws=new WebSocket(url,"obswebsocket.json")}catch(e){return reject(e)}
      this.ws=ws;let settled=false;
      // With OBS closed, Windows Firewall often drops the attempt silently instead of refusing it, so the browser
      // would wait ~20 s. Give up after 6 s (the retry loop tries again).
      const giveUp=setTimeout(()=>{if(!settled&&this.ws===ws)try{ws.close()}catch{}},6000);
      ws.onmessage=ev=>{
        const m=JSON.parse(ev.data);
        if(m.op===0){ // Hello
          const d={rpcVersion:1,eventSubscriptions:this.subs};
          if(m.d.authentication){const{salt,challenge}=m.d.authentication;d.authentication=sha64(sha64(password+salt)+challenge)}
          ws.send(JSON.stringify({op:1,d}));
        }else if(m.op===2){clearTimeout(giveUp);this.ready=true;settled=true;resolve();this.emit("open")}
        else if(m.op===5){this.emit(m.d.eventType,m.d.eventData||{});this.emit("*",m.d)}
        else if(m.op===7){const p=this.pending.get(m.d.requestId);if(!p)return;this.pending.delete(m.d.requestId);
          const st=m.d.requestStatus;st.result?p.res(m.d.responseData||{}):p.rej(Object.assign(new Error(st.comment||("OBS error "+st.code)),{code:st.code}))}
      };
      ws.onclose=ev=>{const was=this.ready;this.ready=false;
        this.pending.forEach(p=>p.rej(new Error("disconnected")));this.pending.clear();
        if(!settled){settled=true;reject(new Error(ev.code===4009?"Wrong OBS websocket password":"Can't reach OBS ("+ev.code+")"))}
        if(was)this.emit("close",ev)};
      ws.onerror=()=>{};
    })}
  // Closing on purpose (e.g. Settings → Save & connect) must also fail the requests still waiting for an answer:
  // the picture loop awaits one, and left pending it would wait forever (black picture until the page reloads).
  close(){if(this.ws){this.ws.onclose=null;try{this.ws.close()}catch{}this.ws=null}this.ready=false;
    this.pending.forEach(p=>p.rej(new Error("disconnected")));this.pending.clear()}
  call(requestType,requestData,timeout=10000){
    if(!this.ready)return Promise.reject(new Error("Not connected"));
    const requestId=String(++this.id);
    return new Promise((res,rej)=>{
      const t=setTimeout(()=>{if(this.pending.delete(requestId))rej(new Error("OBS didn't answer"))},timeout);
      this.pending.set(requestId,{res:v=>{clearTimeout(t);res(v)},rej:e=>{clearTimeout(t);rej(e)}});
      this.ws.send(JSON.stringify({op:6,d:{requestType,requestId,requestData}}))})}
  ptz(device,requestType,data={}){
    return this.call("CallVendorRequest",{vendorName:"obs-ptz",requestType,requestData:{device,...data}})
      .then(r=>{const d=r.responseData||{};if(d.error)throw new Error(d.message||d.error);return d})}
}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
/* ---------- icons ----------
   One line-icon style for the whole app: 24x24, 2 px strokes, round ends, drawn in the text colour.
   Static markup uses <i class="ic" data-i="name"></i>, filled in when the script starts. */
const svgI=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON={
  wifi:svgI('<path d="M2 8.8a15 15 0 0 1 20 0M5 12.4a10 10 0 0 1 14 0M8.5 15.9a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>'),
  monitor:svgI('<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  camera:svgI('<path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/>'),
  film:svgI('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>'),
  gauge:svgI('<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/>'),
  leaf:svgI('<path d="M5 20c0-9 6-15 15-15 0 9-6 15-15 15z"/><path d="M5 20l7-7"/>'),
  dpad:svgI('<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>'),
  joystick:svgI('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/>'),
  speaker:svgI('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>'),
  studio:svgI('<rect x="2" y="6" width="9" height="7" rx="1.5"/><rect x="13" y="6" width="9" height="7" rx="1.5"/><path d="M5 17h14M15 15l2 2-2 2"/>'),
  shuffle:svgI('<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'),
  eye:svgI('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  headphones:svgI('<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/>'),
  eyeOff:svgI('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><path d="M3 3l18 18"/>'),
  gear:svgI('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  take:svgI('<path d="M4 12h15M13 6l6 6-6 6"/>'),
  broadcast:svgI('<circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/>'),
  rec:svgI('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/>'),
  stop:svgI('<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"/>'),
  refresh:svgI('<path d="M21 4v5h-5"/><path d="M20.1 15a8.5 8.5 0 1 1-1.9-8.9L21 9"/>'),
  zoomIn:svgI('<circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.5-4.5M11 8v6M8 11h6"/>'),
  zoomOut:svgI('<circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.5-4.5M8 11h6"/>'),
  focusNear:svgI('<path d="M12 21v-8"/><path d="M8 4l4 3 4-3v5a4 4 0 0 1-8 0z"/><path d="M12 18c-2.5 0-4-1.5-4-3.5M12 18c2.5 0 4-1.5 4-3.5"/>'),
  focusFar:svgI('<path d="M3 20l6-9 4 5 3-4 5 8z"/>'),
  autofocus:svgI('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/>'),
  power:svgI('<path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"/>'),
  volOff:svgI('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>'),
  presets:svgI('<rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
};
document.querySelectorAll("[data-i]").forEach(e=>{e.innerHTML=ICON[e.dataset.i]||""});
const store={get(k,d){try{const v=localStorage.getItem("obsr."+k);return v===null?d:JSON.parse(v)}catch{return d}},
             set(k,v){try{localStorage.setItem("obsr."+k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT;function toast(msg,err){const t=$("toast");t.textContent=msg;t.className="toast show"+(err?" err":"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",err?4000:2000)}
const fail=e=>{console.warn(e);toast(e.message||String(e),true)};
const tc=s=>(s||"00:00:00").split(".")[0];
function buzz(ms=12){try{navigator.vibrate&&navigator.vibrate(ms)}catch{}}

function sheet(html,bind){
  $("sheet").innerHTML=html;$("scrim").classList.add("show");
  const close=()=>$("scrim").classList.remove("show");
  $("sheet").querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  bind&&bind(close);return close}
$("scrim").addEventListener("click",e=>{if(e.target===$("scrim")&&!$("scrim").dataset.lock)$("scrim").classList.remove("show")});
function confirmSheet(title,text,okLabel,danger,onOk){
  sheet(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="btns"><button data-close>Cancel</button><button class="${danger?"danger":"primary"}" id="sheetOk">${esc(okLabel)}</button></div>`,
    close=>$("sheetOk").onclick=()=>{close();onOk()})}

/* ---------- state ---------- */
const obs=new OBS();
const S={scenes:[],program:"",preview:"",studio:false,stream:{},rec:{},audio:[],showAllAudio:false,
  devices:[],dev:store.get("dev",""),presets:{},thumbs:{},showAllPresets:false,liveSources:new Set(),
  // Speed = share of each camera's max speed in its obs-ptz filter. 100% moves exactly like obs-ptz's own dock
  // (which asks for full speed and lets obs-ptz cap it at the max). New key: the old one defaulted to 50%.
  speed:store.get("speed2",1),hidden:new Set(store.get("hidden",[])),
  showAudio:store.get("showAudio",true),ctrl:store.get("ctrl","buttons"),quality:store.get("quality","balanced"),tab:"tabLive"};
const cfg={host:store.get("host",location.hostname||"localhost"),port:store.get("port",4455),pw:store.get("pw","")};
// Sign-in link: the installer's QR code opens http://PC:8765/#pw=...(&port=...). The #fragment never reaches the
// server. Save it like a typed-in login, then take it out of the address bar (and the home-screen icon's address).
(()=>{const h=new URLSearchParams(location.hash.slice(1));if(!h.has("pw")&&!h.has("port"))return;
  cfg.host=location.hostname||cfg.host;cfg.pw=h.get("pw")||"";cfg.port=+h.get("port")||4455;
  store.set("host",cfg.host);store.set("port",cfg.port);store.set("pw",cfg.pw);
  history.replaceState(null,"",location.pathname+location.search)})();

/* ---------- connection ---------- */
let retry=0,retryT;
function setConn(state,label){$("connDot").className="dot "+(state==="ok"?"ok":state==="wait"?"wait":"");$("title").textContent=label}
async function connect(){
  clearTimeout(retryT);setConn("wait","Connecting…");
  try{
    await obs.connect(`ws://${cfg.host}:${cfg.port}`,cfg.pw);
    retry=0;setConn("ok","OBS");showDown(null);await loadAll();
  }catch(e){
    setConn("err","Offline");checkObsDown();

function showDown(st){const box=$("obsDown");
  if(!st||obs.ready){box.hidden=true;return}
  box.hidden=false;
  if(st.starting){$("downT").textContent="Starting OBS…";$("downS").textContent="It connects by itself once OBS is up.";$("btnStartObs").hidden=true;return}
  if(st.running===false){$("downT").textContent="OBS is closed on the PC";$("downS").textContent=st.canStart?"Not running, or it crashed.":"Not running, and OBS Remote can't find it to start it.";$("btnStartObs").hidden=!st.canStart}
  else{$("downT").textContent="OBS isn't answering";$("downS").textContent="It's open, but its WebSocket server isn't on. In OBS: Tools > WebSocket Server Settings.";$("btnStartObs").hidden=true}}
let startingUntil=0;
async function checkObsDown(){
  if(obs.ready)return showDown(null);
  if(Date.now()<startingUntil)return showDown({starting:true});
  try{const r=await fetch("/api/obs",{cache:"no-store"});if(!r.ok)throw 0;const st=await r.json();if(st.running===null)throw 0;showDown(st)}
  catch{showDown(null)}}  // an older server or not on the OBS PC: say nothing extra

    startingUntil=Date.now()+45000;showDown({starting:true});toast("Starting OBS…");

// which sources are visible in the program (one level of nested scenes/groups) -> ON AIR warning
async function refreshLiveSources(){
  const live=new Set(),seen=new Set();
  async function walk(scene,depth){
    if(seen.has(scene)||depth>3)return;seen.add(scene);
    let items;try{items=(await obs.call("GetSceneItemList",{sceneName:scene})).sceneItems}catch{return}
    for(const it of items){if(!it.sceneItemEnabled)continue;live.add(it.sourceName);
      if(it.isGroup)await walkGroup(it.sourceName,depth+1);else if(it.sourceType==="OBS_SOURCE_TYPE_SCENE")await walk(it.sourceName,depth+1)}}
  async function walkGroup(g,depth){let items;try{items=(await obs.call("GetGroupSceneItemList",{sceneName:g})).sceneItems}catch{return}
    for(const it of items)if(it.sceneItemEnabled){live.add(it.sourceName);if(it.sourceType==="OBS_SOURCE_TYPE_SCENE")await walk(it.sourceName,depth+1)}}
  if(S.program)await walk(S.program,0);S.liveSources=live;renderCams();
}

/* ---------- Go live on YouTube (OBS signed in to a YouTube account) ----------
   Signed in (rather than using a stream key), OBS won't stream until its "YouTube Broadcast Setup" dialog is filled
   in on the PC, and obs-websocket can't do that. So the phone asks the same questions, saves the answers as OBS's
   remembered YouTube settings (which pre-fill that dialog), and the server (youtube.py) clicks through the dialog. */
const YT_PRIVACY=[["public","Public"],["unlisted","Unlisted"],["private","Private"]];
const YT_LATENCY=[["normal","Normal"],["low","Low"],["ultraLow","Ultra low"]];
const YT_CATEGORY=[["17","Sports"],["19","Travel and Events"],["20","Gaming"],["22","People and blogs"],["23","Comedy"],["24","Entertainment"],
  ["25","News and Politics"],["26","How-to and Style"],["27","Education"],["28","Science and Technology"],["29","Non-profits and Activism"]];
const ytParam=n=>obs.call("GetProfileParameter",{parameterCategory:"YouTube",parameterName:n}).then(r=>r.parameterValue??"");
async function ytAccount(){
  try{const s=(await obs.call("GetStreamServiceSettings")).streamServiceSettings||{};
    // Signed in = OBS keeps a YouTube login for this profile. (Not "no stream key": after a broadcast OBS keeps
    // that broadcast's key in the settings.) If OBS turns out to have no Manage Broadcast button, youtube.ps1 says
    // noAccount and the phone just starts the stream.
    if(!/youtube/i.test(s.service||""))return null;
    const auth=(await obs.call("GetProfileParameter",{parameterCategory:"Auth",parameterName:"Type"})).parameterValue||"";
    if(!/youtube/i.test(auth))return null;
    // the dialog is filled in by this page's own server, so it must be running on the OBS PC
    const r=await fetch("/api/obs",{cache:"no-store"});if(!r.ok||(await r.json()).running===null)return null;
    const k=["Title","Description","Privacy","CategoryID","Latency","MadeForKids","DVR","ChannelName"];
    const v=Object.fromEntries(await Promise.all(k.map(async n=>[n,await ytParam(n)])));
    return v.ChannelName?v:null}  // OBS saves the channel name when it signs in
  catch{return null}}
function ytSheet(v){
  const opts=(list,cur,def)=>{const c=list.some(x=>x[0]===cur)?cur:def;return list.map(([k,n])=>`<option value="${k}"${k===c?" selected":""}>${n}</option>`).join("")};
  const on=x=>/^(true|1)$/i.test(x);
  sheet(`<h3>Go live on YouTube</h3><p>${v.ChannelName?`Channel: ${esc(v.ChannelName)}. `:""}OBS needs these before it can start. They're filled in on the PC for you.</p>
    <div class="field"><label for="ytTitle">Title</label><input id="ytTitle" maxlength="100" value="${esc(v.Title||"")}"></div>
    <div class="field"><label for="ytDesc">Description</label><textarea id="ytDesc" maxlength="5000">${esc(v.Description||"")}</textarea></div>
    <div class="ytrow"><div class="field"><label for="ytPriv">Privacy</label><select id="ytPriv">${opts(YT_PRIVACY,v.Privacy,"public")}</select></div>
      <div class="field"><label for="ytLat">Latency</label><select id="ytLat">${opts(YT_LATENCY,v.Latency,"normal")}</select></div></div>
    <div class="field"><label for="ytCat">Category</label><select id="ytCat">${opts(YT_CATEGORY,v.CategoryID,"29")}</select></div>
    <label class="tog"><span><b>Made for kids</b><small>YouTube's audience setting</small></span><input type="checkbox" class="sw" id="ytKids"${on(v.MadeForKids)?" checked":""}></label>
    <label class="tog"><span><b>Let viewers rewind</b><small>YouTube's DVR option</small></span><input type="checkbox" class="sw" id="ytDvr"${v.DVR===""||on(v.DVR)?" checked":""}></label>
    <div class="btns"><button data-close>Cancel</button><button class="danger" id="ytGo">Go live</button></div>`,
    close=>$("ytGo").onclick=()=>{const t=$("ytTitle").value.trim();if(!t){toast("Give the broadcast a title",true);return $("ytTitle").focus()}
      const pick=(list,id)=>list.find(x=>x[0]===$(id).value);
      ytGoLive({title:t,description:$("ytDesc").value,privacy:pick(YT_PRIVACY,"ytPriv"),latency:pick(YT_LATENCY,"ytLat"),
        category:pick(YT_CATEGORY,"ytCat"),kids:$("ytKids").checked,dvr:$("ytDvr").checked})})}
let ytBusy=false;  // one Go live at a time: a second tap mustn't run the PC's dialog again
async function ytGoLive(f){if(ytBusy)return;buzz();
  const lock=on=>on?$("scrim").dataset.lock=1:delete $("scrim").dataset.lock;
  sheet(`<h3>Going live…</h3><p>Setting up the broadcast in OBS on the PC. This takes a few seconds.</p>`);lock(true);
  ytBusy=true;
  try{
    const set=(n,x)=>obs.call("SetProfileParameter",{parameterCategory:"YouTube",parameterName:n,parameterValue:String(x)});
    for(const [n,x] of [["Title",f.title],["Description",f.description],["Privacy",f.privacy[0]],["CategoryID",f.category[0]],
      ["Latency",f.latency[0]],["MadeForKids",f.kids],["DVR",f.dvr],["ScheduleForLater",false],["RememberSettings",true]])await set(n,x);
    const r=await fetch("/api/youtube/golive",{method:"POST",headers:{"X-OBS-Remote":"1","X-OBS-Remote-Key":sha64("obs-remote-listen:"+cfg.pw),"Content-Type":"application/json"},
      body:JSON.stringify({title:f.title,description:f.description,privacy:f.privacy[1],category:f.category[1],latency:f.latency[1],kids:f.kids,dvr:f.dvr,dryRun:!!f.dryRun})});
    const j=await r.json().catch(()=>({}));
    if(j.noAccount&&!f.dryRun){await obs.call("StartStream");lock(false);$("scrim").classList.remove("show");return toast("Stream starting")}
    if(!r.ok||!j.ok){
      // The stream is what counts: if OBS is live anyway (the dialog was finished some other way), say so.
      // (give it a few seconds: OBS connects to YouTube just after the PC side finishes)
      let live=false;
      for(let i=0;i<8&&!f.dryRun&&!live;i++){live=await obs.call("GetStreamStatus").then(x=>x.outputActive).catch(()=>false);if(!live)await new Promise(z=>setTimeout(z,750))}
      if(!live)throw new Error(j.error||`The OBS PC said ${r.status}`)}
    lock(false);$("scrim").classList.remove("show");toast(f.dryRun?j.error:"Going live on YouTube")}
  catch(e){lock(false);sheet(`<h3>Couldn't go live</h3><p>${esc(e.message)}</p><div class="btns one"><button data-close>OK</button></div>`)}
  finally{ytBusy=false}}

/* ---------- audio ---------- */
async function loadAudio(){
  const [{inputs},special]=await Promise.all([obs.call("GetInputList"),obs.call("GetSpecialInputs")]);
  const sp=new Set(Object.values(special).filter(Boolean));
  // OBS_SOURCE_AUDIO is a per-type flag, so every browser source claims audio. Like OBS's own mixer,
  // only count a browser source when its "Control audio via OBS" (reroute_audio) box is ticked.
  const cand=inputs.filter(i=>(i.inputKindCaps&2));
  const keep=await Promise.all(cand.map(i=>i.unversionedInputKind!=="browser_source"?true
    :obs.call("GetInputSettings",{inputName:i.inputName}).then(r=>r.inputSettings?.reroute_audio===true).catch(()=>false)));
  const aud=cand.filter((_,k)=>keep[k]);
  const [mutes,mons,vols]=await Promise.all([
    Promise.all(aud.map(i=>obs.call("GetInputMute",{inputName:i.inputName}).then(r=>r.inputMuted).catch(()=>null))),
    Promise.all(aud.map(i=>obs.call("GetInputAudioMonitorType",{inputName:i.inputName}).then(r=>r.monitorType).catch(()=>""))),
    Promise.all(aud.map(i=>obs.call("GetInputVolume",{inputName:i.inputName}).then(r=>r.inputVolumeMul).catch(()=>1)))]);
  S.audio=aud.map((i,k)=>({name:i.inputName,muted:mutes[k],mon:mons[k],vol:vols[k],special:sp.has(i.inputName)})).filter(a=>a.muted!==null);
  await loadMixerHidden();
  renderAudio();
}
// Sources hidden in OBS's own Audio Mixer stay hidden here too. obs-websocket can't see that flag, so the

      <div class="meter${a.muted?" muted":""}" data-meter="${esc(a.name)}">${bar}${bar}</div></div>
      <button class="amon${monOn(a)?" on":""}" data-mon="${esc(a.name)}" aria-label="Monitor ${esc(a.name)}">${ICON.headphones}</button>
      <button class="${a.muted?"muted":""}" data-mute="${esc(a.name)}">${a.muted?ICON.volOff+"Muted":ICON.speaker+"On"}</button></div>`).join("")
    :`<div class="empty">No audio sources in the live scene.</div>`;

$("audio").addEventListener("click",e=>{const m=e.target.closest("[data-mon]");if(m){buzz();toggleMonitor(m.dataset.mon);return}
  const b=e.target.closest("[data-mute]");if(!b)return;buzz();obs.call("ToggleInputMute",{inputName:b.dataset.mute}).catch(fail)});
// volume meters: OBS sends InputVolumeMeters ~20x/s ([magnitude, peak, inputPeak] per channel, linear).
// Always subscribed (see OBS.subs); about 9 KB/s, ignored while the Live tab isn't on screen.
const LV={};
const toDb=m=>m>0?20*Math.log10(m):-100;
// A muted source's level is zeroed in [1], but [2] (before the fader) isn't: like OBS's own mixer, show that
// times the fader, greyed out by the .muted style.
obs.on("InputVolumeMeters",d=>{if(S.tab!=="tabLive"||!S.showAudio||document.hidden)return;const now=performance.now();
  for(const i of d.inputs){const L=LV[i.inputName]??={ch:[{db:-100,hold:-100,holdT:0},{db:-100,hold:-100,holdT:0}],at:0};
    const chs=i.inputLevelsMul;if(!chs.length)continue;L.at=now;
    const a=S.audio.find(x=>x.name===i.inputName),muted=a&&a.muted,vol=a&&a.vol!=null?a.vol:1;
    for(let k=0;k<2;k++){const c=chs[Math.min(k,chs.length-1)],p=toDb(muted?c[2]*vol:c[1]),s=L.ch[k]; // mono -> both bars
      if(p>s.db)s.db=p;if(p>=s.hold){s.hold=p;s.holdT=now}}}});
let meterLast=performance.now();
(function meterLoop(now){
  const dt=Math.min((now-meterLast)/1000,0.25);meterLast=now;
  if(S.tab==="tabLive"&&!document.hidden)for(const m of document.querySelectorAll("[data-meter]")){
    const L=LV[m.dataset.meter],live=L&&now-L.at<1000;m.classList.toggle("idle",!live);
    const bars=m.children;let top=-100;
    for(let k=0;k<2;k++){const s=live?L.ch[k]:{db:-100,hold:-100,holdT:0};
      if(live){s.db=Math.max(s.db-26*dt,-100);if(now-s.holdT>1500)s.hold=Math.max(s.hold-20*dt,s.db)} // OBS-like fall-off + 1.5 s peak hold
      const pct=x=>Math.min(Math.max((x+60)/60,0),1);
      bars[k].firstChild.style.transform=`scaleX(${1-pct(s.db)})`;
      const hd=bars[k].lastChild;hd.style.left=pct(s.hold)*100+"%";hd.style.opacity=s.hold>-60?.9:0;
      top=Math.max(top,s.hold)}
    m.previousElementSibling.lastChild.textContent=top>-60?`${top.toFixed(1)} dB`:"−∞ dB"}
  requestAnimationFrame(meterLoop)})(performance.now());
obs.on("InputAudioMonitorTypeChanged",d=>{const a=S.audio.find(x=>x.name===d.inputName);if(a){a.mon=d.monitorType;renderAudio()}});
obs.on("InputVolumeChanged",d=>{const a=S.audio.find(x=>x.name===d.inputName);if(a)a.vol=d.inputVolumeMul});
obs.on("InputMuteStateChanged",d=>{const a=S.audio.find(x=>x.name===d.inputName);if(a){a.muted=d.inputMuted;renderAudio()}});

/* ---------- monitors (OBS-rendered frames) ----------
   A GetSourceScreenshot costs OBS ~8 ms and doesn't disturb its render loop (measured), so we pull
   frames back-to-back up to the canvas rate (25 fps). Only one request per monitor is in flight, so a
   slow Wi-Fi link just lowers the frame rate instead of piling up. Each frame is decoded off-screen
   before it is swapped in, so there is no flicker. */
const FPS={smooth:25,balanced:10,saver:2};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shotErr={},fpsCount={};
async function frame(src,imgId,w,q,still){
  if(!src||(shotErr[src]&&performance.now()-shotErr[src]<1500))return; // e.g. camera offline: retry slowly
  let r;try{r=await obs.call("GetSourceScreenshot",{sourceName:src,imageFormat:"jpg",imageWidth:w,imageCompressionQuality:q})}
  catch{shotErr[src]=performance.now();return}
  delete shotErr[src];
  // decode() can stall (e.g. a backgrounded tab); never let it hold up the picture loop for more than 2 s
  const im=new Image();im.src=r.imageData;
  try{await Promise.race([im.decode(),sleep(2000).then(()=>{throw new Error("decode timeout")})])}catch{return}
  // the user may have switched camera while this frame was on its way: don't show the old camera
  if(still&&!still())return;
  const old=$(imgId);if(!old)return;im.id=imgId;im.alt="";old.replaceWith(im);
  fpsCount[imgId]=(fpsCount[imgId]||0)+1;
}
async function shotLoop(){
  for(;;){
    if(!obs.ready||document.hidden){await sleep(300);continue}
    const t0=performance.now();
    if(S.tab==="tabLive")await Promise.all([frame(S.program,"imgPgm",480,55),S.studio&&frame(S.preview,"imgPvw",480,55)]);
    else{const d=curDev();if(d){const src=picOf(d);await frame(src,"imgCam",640,62,()=>S.tab!=="tabLive"&&picOf(curDev())===src)}}
    const wait=1000/(FPS[S.quality]||25)-(performance.now()-t0);
    await sleep(Math.max(wait,4));
  }
}
setInterval(()=>{ // small fps readout on each monitor
  for(const id of ["imgPgm","imgPvw","imgCam"]){const el=$(id+"Fps");if(el)el.textContent=(fpsCount[id]||0)+" fps";fpsCount[id]=0}},1000);

/* ---------- PTZ ---------- */
const curDev=()=>S.devices.find(d=>d.device===S.dev);
async function loadDevices(){
  // obs-ptz only has a websocket API from v0.20.0-pre5 / the 1.0 betas. The stable 0.19.x has none, so OBS answers
  // "vendor not found" (code 600) and the Camera tab can't work; say so instead of "no cameras".
  S.ptzMissing=false;
  const r=await obs.call("CallVendorRequest",{vendorName:"obs-ptz",requestType:"ptz_list_devices",requestData:{}})
    .catch(e=>{S.ptzMissing=e.code===600||/vendor/i.test(e.message);return null});
  const devs=r?.responseData?.devices||[];
  S.videoInputs=((await obs.call("GetInputList").catch(()=>({inputs:[]}))).inputs||[])
    .filter(i=>i.inputKindCaps===undefined||(i.inputKindCaps&1)).map(i=>i.inputName);
  S.camCfg=await loadCamCfg();
  S.devices=await Promise.all(devs.map(async d=>{
    const [st,caps]=await Promise.all([obs.ptz(d.device,"ptz_get_state").catch(()=>({state:{}})),loadCaps(d.source)]);
    return{device:d.device,source:d.source,kind:d.name,state:st.state||{},caps,auto:await autoPicture(d.source)}}));
  S.devices.sort((a,b)=>nameOf(a).localeCompare(nameOf(b),undefined,{numeric:true,sensitivity:"base"}));
  if(!curDev()&&S.devices.length)S.dev=(S.devices.find(d=>d.state.connected)||S.devices[0]).device;
  renderCams();await loadPresets();
}
// obs-ptz clamps every move to the camera's own max speed (PTZ filter → Speed settings), it doesn't scale.
// e.g. a camera capped at 0.15 would hit the cap at ~15% on a raw 0..1 slider, and the rest of the slider would do nothing.
// Read the caps and scale into them instead: the slider now runs from slow to that camera's max.
async function loadCaps(source){
  const r=await obs.call("GetSourceFilterList",{sourceName:source}).catch(()=>null);
  const f=(r?.filters||[]).find(x=>/^ca\.secretlab\.obs-ptz\./.test(x.filterKind));
  const st=f?.filterSettings||{},n=(k,alt)=>{const v=st[k]??st[alt];return v>0?v:1};
  return{pan:n("pan_speed_max","pantilt_speed_max"),tilt:n("tilt_speed_max","pantilt_speed_max"),zoom:n("zoom_speed_max"),focus:n("focus_speed_max")};
}
const capOf=k=>curDev()?.caps?.[k]??1;
// The PTZ control can sit on a different source from the picture, e.g. VISCA on a hidden webcam source "CAM01"
// while the scene shows "CAM01-NDI". If the PTZ source isn't producing video, use an active source whose name
// starts with the same name. Settings can override this per camera.
async function autoPicture(source){
  const active=n=>obs.call("GetSourceActive",{sourceName:n}).then(r=>r.videoActive||r.videoShowing).catch(()=>false);
  if(await active(source))return source;
  const low=source.toLowerCase();
  for(const n of (S.videoInputs||[]).filter(n=>n!==source&&n.toLowerCase().startsWith(low)))if(await active(n))return n;
  return source;
}
// Per-camera display names and picture sources live in OBS itself (obs-websocket persistent data, profile realm),
// so every phone sees the same names. Cameras are listed in natural name order (CAM01, CAM02, CAM03, CAM03-USB…).
const CAMCFG={realm:"OBS_WEBSOCKET_DATA_REALM_PROFILE",slotName:"obs-remote.cameras"};
async function loadCamCfg(){

  return{names:v?.names||{},pictures:v?.pictures||{}};
}
const nameOf=d=>d?(S.camCfg?.names?.[d.source]||d.source):"";
const picOf=d=>d?(S.camCfg?.pictures?.[d.source]||d.auto||d.source):"";
const isLive=d=>!!d&&(S.liveSources.has(d.source)||S.liveSources.has(picOf(d)));
function renderCams(){

    :S.ptzMissing?`<div class="empty">OBS has no PTZ control for this app. It needs obs-ptz <b>1.0 (beta)</b> or newer with Settings → Websocket access = “Control”. The stable 0.19.x release has no websocket control. Everything on the Live tab still works.</div>`
    :`<div class="empty">No PTZ cameras found. Is the obs-ptz plugin loaded, with websocket access set to “Control”?</div>`;

// Highlight behind the selected chip. renderCams() rebuilds the chips, so start it where it was and let it slide.
// One highlight element for the life of the page (only the chip list is rebuilt), so a slide in progress
// carries on even when a camera's state update re-renders the chips mid-way.
function camInd(){const c=$("cams"),ind=c.querySelector(".ind"),sel=c.querySelector(".chip.sel");
  if(!sel){ind.hidden=true;return}
  if(!sel.offsetWidth)return;  // tab hidden: placed when it's shown
  const first=ind.hidden;ind.hidden=false;
  if(first){ind.style.transition="none"}
  Object.assign(ind.style,{left:sel.offsetLeft+"px",top:sel.offsetTop+"px",width:sel.offsetWidth+"px",height:sel.offsetHeight+"px"});
  if(first){ind.offsetWidth;ind.style.transition=""}}

// Camera chips: fade the side(s) that have more cameras, and nudge the row once so a swipe looks possible.
function camFade(){const c=$("cams"),max=c.scrollWidth-c.clientWidth;

$("cams").addEventListener("scroll",camFade,{passive:true});addEventListener("resize",camFade);

// Arrows: clear at first, then faded back after 3 s untouched, so they don't sit over the picture.
let wakeT;function camWake(){const m=$("camMon");m.classList.remove("idle");clearTimeout(wakeT);wakeT=setTimeout(()=>m.classList.add("idle"),3000)}

function selectCam(dev){

  stopMove();S.dev=dev;store.set("dev",S.dev);$("imgCam").removeAttribute("src");renderCams();loadPresets();

$("camList").addEventListener("click",e=>{const b=e.target.closest("[data-dev]");if(b)selectCam(b.dataset.dev)});
// Swipe the camera picture left/right for the next/previous camera (wraps round). Pointer events, so it
// works with a finger, pen or mouse. Only a mostly sideways move counts; up/down still scrolls the page
// (touch-action:pan-y hands vertical moves to the browser, which then cancels the pointer). Never moves a camera.
// The picture follows the finger; the name of the camera it will switch to peeks in from the side. Let go past
// a quarter of the width (or flick) to switch, otherwise it springs back. Only transform/opacity change, once
// per frame, so the browser does it on the GPU without re-layout.
(()=>{
  const mon=$("camMon"),peek=$("camPeek");let sx=0,sy=0,id=null,drag=false,dx=0,raf=0,vx=0,lx=0,lt=0,busy=false;
  $("imgCam").draggable=false;
  const target=dir=>{const n=S.devices.length,i=Math.max(0,S.devices.findIndex(d=>d.device===S.dev));return S.devices[(i+dir+n)%n]};
  const paint=()=>{raf=0;const w=mon.offsetWidth||1,x=S.devices.length<2?dx*.25:dx;  // one camera: rubber band
    mon.style.transform=`translateX(${x}px)`;mon.style.opacity=String(1-Math.min(.5,Math.abs(x)/w*.6));
    const t=S.devices.length>1&&Math.abs(x)>12?target(x<0?1:-1):null;
    peek.textContent=t?(x<0?`${nameOf(t)} ›`:`‹ ${nameOf(t)}`):"";peek.className="peek "+(x<0?"r":"l");
    peek.style.opacity=t?String(Math.min(1,Math.abs(x)/(w*.25))):"0"};
  const settle=async(to,ms)=>{const from=mon.style.transform||"none",fo=mon.style.opacity||"1";
    const a=mon.animate([{transform:from,opacity:fo},{transform:to,opacity:to==="none"?1:.4}],{duration:ms,easing:"cubic-bezier(.2,.8,.2,1)"});
    mon.style.transform=to==="none"?"":to;mon.style.opacity=to==="none"?"":".4";try{await a.finished}catch{}};
  const end=async()=>{id=null;if(!drag)return;drag=false;if(raf){cancelAnimationFrame(raf);raf=0}
    peek.style.opacity="0";const w=mon.offsetWidth||1,fast=Math.abs(vx)>.5&&Math.sign(vx)===Math.sign(dx);
    if(S.devices.length<2||(Math.abs(dx)<w*.25&&!fast)){await settle("none",220);return}
    await go(dx<0?1:-1)};
  const go=async dir=>{if(busy||S.devices.length<2)return;busy=true;const w=mon.offsetWidth||1;
    await settle(`translateX(${-dir*w}px)`,140);              // old camera slides out...
    selectCam(target(dir).device);
    mon.style.transform=`translateX(${dir*w*.35}px)`;mon.style.opacity=".4";
    await settle("none",240);busy=false};                     // ...new one slides in from the other side
  $("camPrev").onclick=()=>{buzz();go(-1);camWake()};$("camNext").onclick=()=>{buzz();go(1);camWake()};
  // A swipe can start anywhere on the picture, arrows included. The pointer is only captured once the move is a
  // sideways drag, so a plain tap on an arrow stays an ordinary click.
  mon.addEventListener("pointerdown",e=>{if(!e.isPrimary||e.button>0||busy)return;
    id=e.pointerId;sx=lx=e.clientX;sy=e.clientY;lt=e.timeStamp;dx=0;vx=0;drag=false});
  mon.addEventListener("pointermove",e=>{if(e.pointerId!==id)return;const mx=e.clientX-sx,my=e.clientY-sy;
    if(!drag){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){drag=true;try{mon.setPointerCapture(id)}catch{}}else{if(Math.abs(my)>10)id=null;return}}
    const dt=e.timeStamp-lt;if(dt>0)vx=.7*vx+.3*((e.clientX-lx)/dt);lx=e.clientX;lt=e.timeStamp;
    dx=mx;if(!raf)raf=requestAnimationFrame(paint)});
  mon.addEventListener("pointerup",e=>{if(e.pointerId===id)end()});
  mon.addEventListener("pointercancel",e=>{if(e.pointerId===id){dx=0;end()}});
})();
obs.on("VendorEvent",d=>{
  if(d.vendorName!=="obs-ptz")return;const ed=d.eventData||{};
  if(d.eventType==="ptz_state_changed"){const dev=S.devices.find(x=>x.device===ed.device||x.source===ed.source);
    if(dev){Object.assign(dev.state,ed.changed||{});renderCams()}}
  else if(/^ptz_preset_/.test(d.eventType)&&(!ed.device||ed.device===S.dev)&&d.eventType!=="ptz_preset_recalled")loadPresets();

// movement — continuous velocity while held, always stopped on release
let moving=false,lastSent={p:0,t:0,z:0,f:0},lastAt=0,pendingMove=null,moveTimer=null;
function sendMove(p,t,z,f){
  const d=curDev();if(!d)return;
  pendingMove={p,t,z,f};
  const now=performance.now();
  const flush=()=>{moveTimer=null;if(!pendingMove)return;const m=pendingMove;pendingMove=null;
    if(!moving&&!(m.p||m.t||m.z||m.f))return;
    lastSent=m;lastAt=performance.now();moving=!!(m.p||m.t||m.z||m.f);
    obs.ptz(d.device,"ptz_move",{pan:m.p,tilt:m.t,zoom:m.z,focus:m.f}).catch(fail)};
  if(now-lastAt>90)flush();else if(!moveTimer)moveTimer=setTimeout(flush,90-(now-lastAt));
}
// force=true after a joystick/hold gesture or the Stop button; otherwise only stop if we started a move,
// so switching tabs doesn't cut short a preset recall that is still travelling
function stopMove(force){
  const was=moving||!!pendingMove||!!moveTimer;
  pendingMove=null;clearTimeout(moveTimer);moveTimer=null;moving=false;lastSent={p:0,t:0,z:0,f:0};
  const d=curDev();if(!d||!(force||was))return;
  obs.ptz(d.device,"ptz_stop").catch(()=>{});
}
// Push → share of the Speed slider. Past a small dead zone it starts at MIN and rises gently to 1 at the edge,
// so a light touch isn't a crawl and full push isn't a big jump (was 0→1 with power 1.5: ~30× between the two).
const CURVE={dz:0.12,min:0.25,pow:1.2};
const curve=v=>{const {dz,min,pow}=CURVE,a=Math.abs(v);if(a<dz)return 0;return Math.sign(v)*(min+(1-min)*Math.pow((a-dz)/(1-dz),pow))};

// joystick
(function(){
  const pad=$("pad"),knob=$("knob");let pid=null,startStop=false;
  function at(e){const r=pad.getBoundingClientRect(),R=r.width/2;
    let x=(e.clientX-r.left-R)/R,y=(e.clientY-r.top-R)/R;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
    knob.style.transform=`translate(${x*R*0.7}px,${y*R*0.7}px)`;
    // Speed comes from how far the knob is pushed; direction is stretched to a square so the leading axis
    // gets that full speed. Curving x and y separately gave a 45° push only ~55% speed per axis (too slow diagonally).
    // Pushes within ~7° of straight snap to a pure pan/tilt. The smaller axis is boosted (power 0.6) so a push
    // that's only a little off straight still gives a speed the camera acts on: cameras round tiny speeds down
    // to zero, which made diagonals only work right at 45°. E.g. 20° off straight: 0.36 → 0.54.
    const mag=curve(Math.min(1,Math.hypot(x,y))),big=Math.max(Math.abs(x),Math.abs(y))||1;
    const minor=u=>Math.abs(u)<0.12?0:Math.sign(u)*Math.pow(Math.abs(u),0.6);
    const ux=minor(x/big),uy=minor(y/big);
    sendMove(+(mag*ux*S.speed*capOf("pan")).toFixed(4),+(-mag*uy*S.speed*capOf("tilt")).toFixed(4),0,0)}
  // Scrolling past the joystick: a touch that starts on the outer ring and moves mostly up/down scrolls the page
  // (touch-action:pan-y). One that starts near the middle, or moves sideways, steers, and then blocks scrolling.
  // Until it's decided nothing is sent, so a scroll never nudges the camera.
  let steer=false,sx=0,sy=0;
  const take=e=>{steer=true;pad.classList.add("active");buzz();at(e)};
  pad.addEventListener("pointerdown",e=>{if(pid!==null)return;pid=e.pointerId;try{pad.setPointerCapture(pid)}catch{}
    const r=pad.getBoundingClientRect(),R=r.width/2;sx=e.clientX;sy=e.clientY;steer=false;
    if(e.pointerType!=="touch"||Math.hypot(e.clientX-r.left-R,e.clientY-r.top-R)<R*0.45)take(e)});
  pad.addEventListener("pointermove",e=>{if(e.pointerId!==pid)return;if(steer){at(e);return}
    const dx=Math.abs(e.clientX-sx),dy=Math.abs(e.clientY-sy);if(dx+dy>6&&dx>dy)take(e)});
  pad.addEventListener("touchmove",e=>{if(steer)e.preventDefault()},{passive:false});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;const was=steer;steer=false;pad.classList.remove("active");knob.style.transform="";if(was)stopMove(true)};
  pad.addEventListener("pointerup",end);pad.addEventListener("pointercancel",end);pad.addEventListener("lostpointercapture",end);
})();
// hold buttons (zoom / focus)
// A finger that swipes across a hold button scrolls the page (touch-action:pan-y) and the browser then cancels the
// pointer. So a touch only starts moving after HOLD_DELAY: a scroll is recognised before that and never nudges the
// camera. A mouse or pen starts at once.
const HOLD_DELAY=120;
function holdButton(btn,start){
  let held=false,timer=0;
  btn.addEventListener("pointerdown",e=>{if(btn.disabled)return;try{btn.setPointerCapture(e.pointerId)}catch{}
    const go=()=>{timer=0;held=true;buzz();start()};
    if(e.pointerType==="touch")timer=setTimeout(go,HOLD_DELAY);else go()});
  const end=()=>{clearTimeout(timer);timer=0;if(!held)return;held=false;stopMove(true)};
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>btn.addEventListener(ev,end));
  btn.addEventListener("contextmenu",e=>e.preventDefault());
}

// ↻ Refresh: reconnect a frozen picture AND the PTZ link. Network cameras sometimes stall (an NDI|HX receiver keeps
// showing the last frame) or reboot (obs-ptz doesn't reconnect by itself), while OBS reports nothing wrong.
async function refreshPicture(src){
  const r=await obs.call("GetInputSettings",{inputName:src}),k=r.inputKind||"",s=r.inputSettings||{};
  if(/^ndi_source/.test(k)&&s.ndi_source_name){ // DistroAV / obs-ndi: dropping the source and picking it again rebuilds the receiver
    await obs.call("SetInputSettings",{inputName:src,inputSettings:{ndi_source_name:""}});await sleep(800);
    await obs.call("SetInputSettings",{inputName:src,inputSettings:{ndi_source_name:s.ndi_source_name}});return}
  if(k==="ffmpeg_source"||k==="vlc_source"){await obs.call("TriggerMediaInputAction",{inputName:src,mediaAction:"OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART"});return}
  if(k==="browser_source"){await obs.call("PressInputPropertiesButton",{inputName:src,propertyName:"refreshnocache"});return}
  if(k==="dshow_input"&&s.active!==false){ // same as the Deactivate / Activate button in its properties
    await obs.call("SetInputSettings",{inputName:src,inputSettings:{active:false}});await sleep(800);
    await obs.call("SetInputSettings",{inputName:src,inputSettings:{active:true}});return}
  // anything else (obs-gstreamer, RTSP plugins, …): re-applying its own settings makes OBS call the source's
  // update(), which restarts the pipeline/connection
  await obs.call("SetInputSettings",{inputName:src,inputSettings:s});
}
async function refreshPtz(d,gap=2500){
  const r=await obs.call("GetSourceFilterList",{sourceName:d.source});
  const f=(r.filters||[]).find(x=>/^ca\.secretlab\.obs-ptz\./.test(x.filterKind));if(!f)return;
  // connection fields that are text: host/address (IP cameras) or port (serial name, e.g. COM3). A numeric
  // "address" is a serial camera number and a numeric "port" is a UDP/TCP port, so those are left alone.
  const s=f.filterSettings||{},orig={},blank={};
  for(const key of ["host","address","port"])if(typeof s[key]==="string"&&s[key]){orig[key]=s[key];blank[key]=key==="port"?"":"127.0.0.2"}
  if(!Object.keys(orig).length)return;
  const set=v=>obs.call("SetSourceFilterSettings",{sourceName:d.source,filterName:f.filterName,filterSettings:v,overlay:true});
  // obs-ptz needs the dummy address to sit for a moment: switching back within ~1 s never reconnected in testing,
  // 1.5 s and longer always did. 2.5 s leaves a margin.
  await set(blank);await sleep(gap);await set(orig);
}
const ptzConnected=async(d,secs)=>{for(let i=0;i<secs;i++){await sleep(1000);
  const st=await obs.ptz(d.device,"ptz_get_state").catch(()=>null);if(st?.state){d.state=st.state;if(d.state.connected)return true}}return false};
$("btnRefresh").onclick=()=>{const d=curDev();if(!d)return;
  const go=async()=>{const b=$("btnRefresh");b.disabled=true;stopMove(true);toast("Reconnecting "+nameOf(d)+"…");
    const errs=[];
    await Promise.all([refreshPicture(picOf(d)).catch(e=>errs.push("picture: "+e.message)),refreshPtz(d).catch(e=>errs.push("PTZ: "+e.message))]);
    delete shotErr[picOf(d)];
    // wait for the camera link to come back; one slower retry if it doesn't (e.g. camera still booting)
    if(!errs.length&&!await ptzConnected(d,5)){await refreshPtz(d,4000).catch(()=>{});await ptzConnected(d,8)}
    b.disabled=false;renderCams();loadPresets();
    if(errs.length)toast(errs.join(" · "),true);
    else toast(d.state.connected?nameOf(d)+" reconnected":nameOf(d)+": picture refreshed, PTZ camera not answering",!d.state.connected)};
  isLive(d)?confirmSheet("Refresh "+nameOf(d)+"?","This camera is ON AIR. Its picture will drop for a second or two while it reconnects.","Refresh",true,go):go()};

// Scroll-safe slider: the bar itself ignores touches (CSS). Up/down over it scrolls the page, a tap changes
// nothing, and only a sideways drag moves it, relative to where the finger started (no jump to the tap point).
(()=>{
  const box=$("speed").parentElement,inp=$("speed");let id=null,sx=0,sy=0,v0=0,drag=false;
  const min=+inp.min,max=+inp.max,step=+inp.step||0.05;
  box.addEventListener("pointerdown",e=>{if(!e.isPrimary||e.button>0)return;id=e.pointerId;sx=e.clientX;sy=e.clientY;v0=+inp.value;drag=false;
    try{box.setPointerCapture(id)}catch{}});
  box.addEventListener("pointermove",e=>{if(e.pointerId!==id)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!drag){if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy))drag=true;else{if(Math.abs(dy)>10)id=null;return}}
    const v=Math.min(max,Math.max(min,Math.round((v0+dx/inp.offsetWidth*(max-min))/step)*step));
    if(v!==+inp.value){inp.value=v;inp.dispatchEvent(new Event("input"))}});
  box.addEventListener("touchmove",e=>{if(drag&&id!==null)e.preventDefault()},{passive:false});
  const end=e=>{if(e.pointerId===id){id=null;drag=false}};
  box.addEventListener("pointerup",end);box.addEventListener("pointercancel",end);
})();

async function loadThumb(dev,id){

/* ---------- listen on the phone ---------- */
// The server on the OBS PC records OBS's audio monitoring device (Settings → Audio → Advanced) and streams it as
// raw 24 kHz mono 16-bit PCM (listen.py). Only sources set to monitor in OBS are heard: the headphone button on
// each audio row switches a source between "Monitor Off" and "Monitor and Output".
// Nothing plays, and the server records nothing, until someone taps Listen.
const monOn=a=>a.mon==="OBS_MONITORING_TYPE_MONITOR_AND_OUTPUT"||a.mon==="OBS_MONITORING_TYPE_MONITOR_ONLY";
function toggleMonitor(name){const a=S.audio.find(x=>x.name===name);if(!a)return;
  obs.call("SetInputAudioMonitorType",{inputName:name,monitorType:monOn(a)?"OBS_MONITORING_TYPE_NONE":"OBS_MONITORING_TYPE_MONITOR_AND_OUTPUT"}).catch(fail)}
const LISTEN_RATE=24000;
const player={ctx:null,ctrl:null,next:0,on:false,
  async start(){
    if(this.on)return;
    try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch{} // iPhone: play even with the silent switch on
    this.ctx??=new (window.AudioContext||window.webkitAudioContext)();
    this.ctx.resume();  // must happen inside the tap
    this.on=true;this.next=0;renderListen();
    const ctrl=this.ctrl=new AbortController();
    try{
      const r=await fetch("/api/listen",{headers:{"X-OBS-Remote-Key":sha64("obs-remote-listen:"+cfg.pw)},signal:ctrl.signal,cache:"no-store"});
      if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||`The OBS PC said ${r.status}`);
      const rd=r.body.getReader();let rest=null;
      for(;;){const {value,done}=await rd.read();if(done)break;
        let b=value;if(rest){const m=new Uint8Array(rest.length+b.length);m.set(rest);m.set(b,rest.length);b=m;rest=null}
        if(b.length&1){rest=b.slice(-1);b=b.subarray(0,b.length-1)}
        if(b.length)this.play(new Int16Array(b.slice().buffer))}
      if(ctrl===this.ctrl){const st=await (await fetch("/api/listen-state",{cache:"no-store"})).json().catch(()=>({}));
        throw new Error(st.error?`Can't record ${st.device||"the monitoring device"}: ${st.error}`:"Listening stopped")}
    }catch(e){if(ctrl===this.ctrl&&e.name!=="AbortError")toast(e.message,true)}
    finally{if(ctrl===this.ctrl)this.stop()}},
  play(i16){const c=this.ctx,n=i16.length,buf=c.createBuffer(1,n,LISTEN_RATE),ch=buf.getChannelData(0);
    for(let k=0;k<n;k++)ch[k]=i16[k]/32768;
    const src=c.createBufferSource();src.buffer=buf;src.connect(c.destination);const now=c.currentTime;
    // ~150 ms cushion against Wi-Fi hiccups; if it grows past 600 ms, skip ahead so the delay stays short
    if(this.next<now+0.03||this.next>now+0.6)this.next=now+0.15;
    src.start(this.next);this.next+=n/LISTEN_RATE},
  stop(){this.on=false;const c=this.ctrl;this.ctrl=null;try{c&&c.abort()}catch{}renderListen()}};
function renderListen(){const b=$("btnListen");b.hidden=false;
  b.classList.toggle("on",player.on);b.innerHTML=`${ICON.headphones}${player.on?"Stop":"Listen"}`}
$("btnListen").onclick=()=>{buzz();player.on?player.stop():player.start()};

      <div class="field"><label>picture</label><select data-pic="${esc(d.source)}">

/* ---------- auto-reconnect of frozen NDI cameras (runs in server.py, see autofix.py) ---------- */
const APPSET={realm:"OBS_WEBSOCKET_DATA_REALM_PROFILE",slotName:"obs-remote.settings"};
async function loadAutofix(){
  const el=$("sFix");if(!el)return;
  let a;try{const r=await fetch("/api/autofix",{cache:"no-store"});if(!r.ok)return;a=await r.json()}catch{return}
  const t=x=>new Date(x*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const today=a.events.filter(e=>new Date(e.t*1000).toDateString()===new Date().toDateString());
  const last=a.events[a.events.length-1];
  const info=!a.running?`Not running: ${esc(a.error||"can't reach OBS")}`
    :!a.watching.length?"No NDI cameras to watch."
    :`Watching ${a.watching.map(esc).join(", ")}.`+(last?` Last fix: ${esc(last.source)} at ${t(last.t)} (${today.length} today).`:" No freezes so far.");
  el.innerHTML=`<label class="check"><input type="checkbox" id="sAutofix" ${a.enabled?"checked":""}>Reconnect a camera automatically when its NDI picture freezes</label>
    <p class="hint" style="margin:-6px 0 6px 30px;font-size:12px;color:var(--dim)">If a camera's picture shows the exact same frame for 20 seconds after it was moving, the OBS PC re-selects its NDI source, at most once a minute. It never moves a camera or changes scenes, and works even with no phone open.</p>
    <p class="hint" style="margin:0 0 14px 30px;font-size:12px;color:var(--dim)">${info}</p>`}

/* ---------- self-update ----------
   server.py compares its VERSION with the one on GitHub and, on request, downloads main and restarts itself.
   OBS isn't touched. A page served some other way has no /api and this stays hidden. */
S.upd=null;
async function checkUpdate(fresh){  // fresh: ask GitHub now instead of the server's 10-minute cache
  try{const r=await fetch("/api/version"+(fresh?"?fresh=1":""),{cache:"no-store"});S.upd=r.ok?await r.json():null}catch{S.upd=null}
  $("btnSettings").classList.toggle("badge",!!(S.upd?.update&&!S.upd.blocked));renderUpd()}
function renderUpd(){
  const el=$("sUpd"),u=S.upd;if(!el)return;if(!u){el.innerHTML="";return}
  el.innerHTML=`<div class="upd"><span><b>OBS Remote ${esc(u.version)}</b><br>${
    u.update?(u.blocked?`${esc(u.latest)} is available. ${esc(u.blocked)}`:`Version ${esc(u.latest)} is available.`)
    :u.latest?"Up to date.":"Couldn't check for updates. Is the OBS PC online?"}</span>${
    u.update&&!u.blocked?`<button class="primary" id="sUpdate">Update</button>`:`<button id="sCheck">Check for updates</button>`}</div>`;
  if($("sCheck"))$("sCheck").onclick=async()=>{const b=$("sCheck");b.disabled=true;b.textContent="Checking…";
    await checkUpdate(true);if(S.upd&&!S.upd.update&&S.upd.latest)toast(`You have the latest version (${S.upd.version}).`)};
  // release notes (GitHub markdown, shown as plain text) above the usual explanation
  const notes=(u.notes||"").replace(/\r/g,"").replace(/^#+\s*/gm,"").replace(/\*\*|__|`/g,"").trim();
  if($("sUpdate"))$("sUpdate").onclick=()=>confirmSheet(`Update to ${u.latest}?`,
    (notes?(notes.length>600?notes.slice(0,600)+"…":notes)+"\n\n":"")+
    "The OBS PC downloads the new version from GitHub and restarts the app's web server. OBS itself keeps running. Phones reload in a few seconds.",
    "Update",false,runUpdate)}
async function runUpdate(){
  toast("Updating…");
  let j={};try{const r=await fetch("/api/update",{method:"POST",headers:{"X-OBS-Remote":"1"}});j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Update failed")}
  catch(e){toast(e.message||"Update failed",true);return}
  toast(`Updated to ${j.version}. Reloading…`);
  for(let i=0;i<40;i++){await sleep(1000); // wait for the restarted server, then load the new page
    try{const v=await (await fetch("/api/version",{cache:"no-store"})).json();if(v.version===j.version){location.reload();return}}catch{}}
  toast("The app server didn't come back. Run Install.bat on the OBS PC.",true)}
checkUpdate();setInterval(checkUpdate,6*3600e3);
