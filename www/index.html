<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OBS Remote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OBS Remote</title>
<style>
/* Look: the gear people already know (docs/redesign-prototype.html has the reasoning).
   - OBS-like neutral greys; colour only means something: red = on air (program, LIVE), green = preview,
     blue = selected / switched on, amber = needs attention (muted, update). Stop controls are not red.
   - one key for everything you press (scenes, presets): picture on top, name below, lit border for its state.
   - the system font, as OBS uses. Every icon comes with a word, except ⋮, back and star. */
:root{
  --bg:#17181c; --panel:#1f2025; --key:#2a2b31; --key-hi:#353740; --line:#393b44; --text:#ececee; --dim:#9a9ca5;
  --sel:#4f7dd8; --sel-dim:#13284a; --sel-text:#a9c4ff; --pgm:#e5372f; --pgm-dim:#3a1715; --pvw:#2fbf57; --pvw-dim:#132a1a; --warn:#e9a23b;
  --gap:8px; --hh:56px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding:var(--safe-t) 0 calc(66px + var(--safe-b))}
button{font:inherit;color:inherit;background:var(--key);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{background:var(--key-hi)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.ic{display:inline-flex;flex:none;font-style:normal;line-height:0}
.ic svg{width:1.2em;height:1.2em}

/* header: connection, collection, status tags, ⋮ */
header{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px;height:var(--hh)}
.conn{width:8px;height:8px;border-radius:50%;background:var(--pgm);flex:none}
.conn.ok{background:var(--pvw)}.conn.wait{background:var(--warn)}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Stream / Record: while off they're buttons that say what they do (Go live, Record); while on they turn into
   red status with the timecode, as OBS's own Start/Stop Streaming does. Either way a tap opens the same sheet. */
.tag{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:7px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.tag i{width:7px;height:7px;border-radius:50%;background:#fff;display:none}
.tag .tic{display:none;line-height:0}.tag .tic svg{width:15px;height:15px}
.tag.act{background:var(--key);border:1px solid var(--line);color:var(--text)}
.tag.act .tic{display:inline-flex}
.tag.on{background:var(--pgm);border:1px solid var(--pgm);color:#fff}.tag.on i{display:block}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}.tag.warn i{display:block;background:var(--warn)}
@media (max-width:400px){.tag{padding:6px 7px;gap:4px}header .wrap{gap:6px}}
@media (max-width:360px){.tag .lw{display:none}}  /* narrow phones: just the dot and the time */
.icon-btn{padding:8px;border:0;background:transparent;color:var(--dim);display:flex;position:relative}
.icon-btn:active{background:var(--key)}
.icon-btn svg{width:22px;height:22px}
.badge::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* OBS closed / not answering (Start OBS: server.py /api/obs/start) */
.down{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:12px;border-radius:10px;background:#2a1d0c;border:1px solid #9e6a03}
.down span{flex:1;display:flex;flex-direction:column;gap:2px}
.down small{font-size:12px;color:var(--dim)}
.down button{flex:none;background:var(--text);border-color:var(--text);color:#141518;font-weight:700;padding:10px 14px;display:flex;align-items:center;gap:6px}
.down button svg{width:18px;height:18px}

/* section labels */
h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 .h{text-transform:none;letter-spacing:0;font-weight:500}
h2 .bs{display:flex;gap:6px}
h2 button{font-size:12px;padding:5px 10px;text-transform:none;letter-spacing:0;color:var(--text);display:flex;align-items:center;gap:5px;font-weight:600}
h2 button svg{width:14px;height:14px}
h2 button.on{background:var(--sel);border-color:var(--sel);color:#fff}
.empty{color:var(--dim);font-size:13px;padding:10px 2px}
.keys>.empty{grid-column:1/-1}
.note{font-size:12px;color:var(--dim);margin:12px 2px 0}

/* the picture stays pinned under the header while the page scrolls */
.stick{position:sticky;top:var(--hh);z-index:4;background:var(--bg);margin:0 -14px;padding:12px 14px 10px;box-shadow:0 10px 12px -12px #000}
.stick .mon{max-height:40vh;max-height:40dvh}
@media (max-height:500px){.stick{position:static;box-shadow:none}}  /* phone on its side: no room to pin it */

/* monitors */
.monitors{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.monitors.single{grid-template-columns:1fr}
.mon{position:relative;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:16/9;outline:2px solid var(--line);outline-offset:-2px;margin:0 auto;width:100%}
.mon img{width:100%;height:100%;object-fit:contain;display:block}
.mon img:not([src]){visibility:hidden}
.mon .lab{position:absolute;left:4px;top:4px;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:3px;color:#fff;background:#000a}
.mon.pgm{outline-color:var(--pgm)}.mon.pgm .lab{background:var(--pgm)}
.mon.pvw{outline-color:var(--pvw)}.mon.pvw .lab{background:var(--pvw);color:#06210f}
.mon .fps{font-size:9px;font-weight:600;padding:1px 4px;border-radius:3px;background:#000a;color:#fffc;font-variant-numeric:tabular-nums}
.mon>.fps{position:absolute;right:4px;top:4px}
.mon .fps:empty{display:none}
.mon .name{position:absolute;left:6px;bottom:3px;right:6px;font-size:11px;font-weight:600;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take{display:grid;grid-template-columns:72px 1fr;gap:var(--gap);margin-top:var(--gap)}
.take button{padding:11px 8px;font-weight:700;letter-spacing:.04em}
#btnTake{background:var(--text);border-color:var(--text);color:#141518;display:flex;align-items:center;justify-content:center;gap:10px}
#btnTake:active{background:#cfcfd3}
#btnTake svg{width:18px;height:18px}
#btnTake small{font-weight:500;letter-spacing:0;opacity:.65;font-size:12px}

/* keys: scenes and presets */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
@media (min-width:480px){.keys{grid-template-columns:repeat(4,1fr)}}
.key{padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;position:relative;border-width:2px;touch-action:pan-y;min-width:0}
.key .th{aspect-ratio:16/9;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:20px;font-weight:700;overflow:hidden}
.key .th img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.key .th img:not([src]){visibility:hidden}
.key .kn{padding:6px 7px 7px;font-size:12px;font-weight:600;line-height:1.2;min-height:2.6em;word-break:break-word}
.key.pgm{border-color:var(--pgm);background:var(--pgm-dim)}
.key.pvw{border-color:var(--pvw);background:var(--pvw-dim)}
.key .tally{position:absolute;right:4px;top:4px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 4px;border-radius:3px}
.key.pgm .tally{background:var(--pgm);color:#fff}.key.pvw .tally{background:var(--pvw);color:#06210f}
.key.hit{border-color:var(--sel)}
.key.all{border-style:dashed;background:transparent}
.key.all .th{background:transparent}

/* camera tab */
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:12px;scrollbar-width:none;--fl:0px;--fr:0px;
  /* fade an edge while more cameras are hidden past it (see camFade), so the row reads as scrollable */
  -webkit-mask-image:linear-gradient(to right,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);
          mask-image:linear-gradient(to right,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent)}
.chips::-webkit-scrollbar{display:none}
#cams{position:relative}
#camList{display:flex;gap:8px}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;position:relative;z-index:1}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--pgm)}.chip .dot.ok{background:var(--pvw)}
.chip.sel{background:transparent;border-color:transparent}
.chip .air{font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 4px;border-radius:3px;background:var(--pgm);color:#fff}
/* the chips row doubles as the page indicator for the swipeable picture: a highlight slides to the camera shown */
/* White pill over the chips. It carries its own copy of the chip row in dark text (.indtext), shifted back by the
   pill's own offset and clipped to it, so a name is dark exactly where the pill covers it, even mid-slide. */
#cams .ind{position:absolute;left:0;top:0;z-index:2;border-radius:999px;background:var(--text);pointer-events:none;overflow:hidden;will-change:transform,width;
  transition:transform .38s cubic-bezier(.22,.9,.28,1),width .38s cubic-bezier(.22,.9,.28,1)}
#cams .indtext{position:absolute;display:flex;gap:8px;will-change:transform;transition:transform .38s cubic-bezier(.22,.9,.28,1)}
#cams .indtext .chip{background:transparent;border-color:transparent;color:#141518}
#cams .ind.drag,#cams .ind.drag .indtext{transition:none}  /* following a finger on the picture */
#tabCam .stick{overflow:hidden}
.camview{position:relative}
#camMon{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:transform}
#camMon img{-webkit-user-drag:none;pointer-events:none}
.mon .tr{position:absolute;right:4px;top:4px;display:flex;gap:4px;align-items:center}
.onair{display:none;font-size:10px;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:3px;background:var(--pgm);color:#fff;align-items:center;gap:4px}
.onair::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.onair.show{display:flex}
.peek{position:absolute;top:50%;transform:translateY(-50%);font-weight:700;font-size:15px;opacity:0;pointer-events:none;white-space:nowrap}
.peek.r{right:50px}.peek.l{left:50px}  /* clear of the side arrows (they reach 40 px in) */
/* an arrow each side (also tappable); faded after a few seconds untouched */
.camnav{position:absolute;top:18%;bottom:18%;width:48px;z-index:2;padding:0;border:0;border-radius:0;background:none;color:#fff;opacity:.9;
  display:flex;align-items:center;justify-content:center;transition:opacity .6s,transform .15s}
.camnav:active{background:none;opacity:1;transform:scale(.85);transition:none}
.camnav.l{left:-6px}.camnav.r{right:-6px}
.camnav svg{width:26px;height:26px;filter:drop-shadow(0 0 2px #000a) drop-shadow(0 1px 1px #0008)}
.camview.idle .camnav{opacity:.28}
/* Move | Presets: one panel, two faces of equal standing */
.pseg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;background:var(--panel)}
.pseg button{border:0;border-radius:0;background:transparent;padding:10px 4px;font-weight:600;font-size:14px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:7px}
.pseg button svg{width:18px;height:18px}
.pseg button+button{border-left:1px solid var(--line)}
.pseg button.sel{background:var(--key-hi);color:var(--text)}
.face{margin-top:10px;min-height:236px}
.face h2{margin-top:0}
.ctl{display:grid;grid-template-columns:1fr 80px;gap:var(--gap);align-items:stretch}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;aspect-ratio:1;max-width:260px;width:100%;margin:0 auto;align-self:center}
.dpad button,.side button,#focusRow button{touch-action:pan-y}  /* swipe over them to scroll (see holdButton) */
.dpad button{padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px}
.dpad button svg{width:28px;height:28px;transform:rotate(var(--r))}
.dpad button.diag{background:var(--panel);color:var(--dim)}
.dpad button.diag svg{width:22px;height:22px}
.dpad button.held,.side button.held,#focusRow button.held{background:var(--sel);border-color:var(--sel);color:#fff}
.dpad .mid svg{width:18px;height:18px;transform:none}
.pad{position:relative;aspect-ratio:1;max-width:260px;width:100%;align-self:center;margin:0 auto;border-radius:50%;background:radial-gradient(circle,var(--key) 0 30%,var(--panel) 31% 100%);border:1px solid var(--line);touch-action:pan-y}
.pad::before,.pad::after{content:"";position:absolute;background:var(--line)}
.pad::before{left:50%;top:10%;bottom:10%;width:1px}
.pad::after{top:50%;left:10%;right:10%;height:1px}
.knob{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:var(--sel);box-shadow:0 4px 14px #0008;transition:transform .12s;pointer-events:none;z-index:1}
.pad.active .knob{transition:none}
.side{display:flex;flex-direction:column;gap:var(--gap)}
.side button{flex:1;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--dim)}
.side button svg{width:24px;height:24px;color:var(--text)}
.side button.held svg{color:#fff}.side button.held{color:#fff}
#focusRow{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:var(--gap);margin-top:12px}
#focusRow button{padding:10px 6px;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
#focusRow button svg{width:16px;height:16px;flex:none}
#btnAF.on{border-color:var(--sel);color:var(--sel-text)}
.speed{display:flex;align-items:center;gap:10px;margin-top:var(--gap);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.speed input{flex:1;accent-color:var(--sel);pointer-events:none}  /* driven by the row's own drag handler */
.speed span{min-width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
.speed .spl{display:flex;align-items:center;gap:7px;text-align:left;min-width:0;color:var(--text);font-weight:600}
.speed .spl svg{width:18px;height:18px;color:var(--dim)}

/* audio */
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--gap);align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.ainfo{min-width:0;display:flex;flex-direction:column;gap:6px}
.atop{display:flex;align-items:baseline;gap:8px}
.arow .n{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .db{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.meter{display:flex;flex-direction:column;gap:2px}
/* -60..0 dB, OBS colours: green to -20 dB, yellow to -9 dB, red above */
.mbar{position:relative;height:5px;border-radius:3px;overflow:hidden;background:linear-gradient(to right,#2fbf57 0 66.7%,#e2b33c 66.7% 85%,#e5372f 85%)}
.mbar .cv{position:absolute;inset:0;background:#0c0d10;transform-origin:right;transform:scaleX(1)}
.mbar .hd{position:absolute;top:0;bottom:0;width:2px;margin-left:-2px;left:0;background:#fff;opacity:0}
.meter.muted .mbar{filter:grayscale(1);opacity:.45}
.meter.idle .mbar{opacity:.35}
.mute{width:80px;padding:9px 6px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.mute svg{width:16px;height:16px;flex:none}
.mute.muted{background:var(--warn);border-color:var(--warn);color:#2a1a02}
.amon{width:42px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.amon svg{width:18px;height:18px}
.amon.on{background:var(--sel-dim);border-color:var(--sel);color:var(--sel-text)}
.listening{display:flex;align-items:center;gap:8px;margin:0 0 4px;padding:8px 10px;border-radius:8px;background:var(--sel-dim);border:1px solid var(--sel);font-size:12px;color:#c9d8ff}
.listening i{width:8px;height:8px;border-radius:50%;background:var(--sel-text);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* bottom tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:60px;padding:0}
nav button{background:none;border:none;border-radius:0;color:var(--dim);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}
nav button:active{background:none}
nav button svg{width:22px;height:22px}
nav button.sel{color:var(--text)}nav button.sel svg{color:var(--sel)}
.tab{display:none}.tab.sel{display:block}

/* sheets */
.scrim{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--panel);border-radius:16px 16px 0 0;border:1px solid var(--line);padding:18px 16px calc(18px + var(--safe-b));
  max-height:calc(100vh - 24px - var(--safe-t));max-height:calc(100dvh - 24px - var(--safe-t));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet p{margin:0 0 14px;color:var(--dim);font-size:14px;white-space:pre-line}
.sheet .btns{position:sticky;bottom:calc(-18px - var(--safe-b));margin:0 -16px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.sheet .btns.one{grid-template-columns:1fr}
.sheet .btns button{font-weight:600}
.sheet .danger{background:var(--pgm);border-color:var(--pgm);color:#fff;font-weight:700}
.sheet .primary{background:var(--text);border-color:var(--text);color:#141518;font-weight:700}
/* stream and recording sheet */
.out{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.oname{display:flex;align-items:center;gap:10px;min-width:0}
.oname>svg{width:20px;height:20px;flex:none;color:var(--dim)}
.oname b{display:block;font-size:15px}.oname span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.oname .live{color:var(--pgm);font-weight:600}.oname .warn{color:var(--warn);font-weight:600}
.hold{position:relative;overflow:hidden;width:136px;padding:12px 8px;font-weight:700;font-size:13px;touch-action:none}
.hold .fill{position:absolute;inset:0;background:var(--pgm);transform-origin:left;transform:scaleX(0)}
.hold span{position:relative}
.hold.go{background:var(--text);color:#141518;border-color:var(--text)}
.ostats{font-size:12px;color:var(--dim);margin:4px 0 0;font-variant-numeric:tabular-nums}
/* form fields (YouTube sheet, connection page) */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--dim)}
.field input,.field textarea,.field select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px}
.field textarea{resize:vertical;min-height:72px}
.ytrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ytrow .field{min-width:0}.ytrow select{width:100%}
.tog{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tog>span{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tog small{font-size:12px;color:var(--dim)}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:var(--key);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#c9cbd1;transition:transform .15s}
.sw:checked{background:var(--sel);border-color:var(--sel)}
.sw:checked::after{transform:translateX(18px);background:#fff}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);background:#33353c;color:var(--text);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.toast.err{background:#5c1a1d}

/* ⋮ menu */
.menu{position:fixed;top:calc(var(--hh) + var(--safe-t) - 4px);right:max(8px,calc((100vw - 560px)/2 + 8px));width:270px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px #000b;z-index:30;overflow:hidden}
/* stats block: three figures, then any warnings as label/value rows inside the same block (one divider below it) */
.mstatsw{border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-variant-numeric:tabular-nums}
.mstats b{display:block;font-size:15px}.mstats span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.mstats-x{display:flex;flex-direction:column;gap:3px;padding-top:8px;border-top:1px solid var(--line)}
.mstats-x div{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim)}
.mstats-x b{font-weight:600;color:var(--warn);font-variant-numeric:tabular-nums}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px;background:transparent;border:0;border-radius:0;text-align:left;font-size:14px;cursor:pointer;position:relative}

/* full-screen pages: settings, connection, scenes */

.page.show{transform:none;visibility:visible}
#pg2{z-index:21}
.ph{flex:none;border-bottom:1px solid var(--line)}
.ph .wrap{display:flex;align-items:center;gap:6px;height:var(--hh);padding-left:6px}

.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 12px;background:transparent;border:0;border-radius:0;text-align:left;font-size:15px;cursor:pointer}
.row:active{background:var(--key)}
.row .grow{flex:1;min-width:0}.row small{display:block;font-size:12px;color:var(--dim);margin-top:2px}

.seg{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}

details.hand summary::before{content:"▸ "}details.hand[open] summary::before{content:"▾ "}
.find{font:inherit;width:100%;margin:12px 0 10px;padding:11px 12px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px}
.srow{display:flex;align-items:center}

.srow.pgm .suse small{color:var(--pgm)}.srow.pvw .suse small{color:var(--pvw)}
.sth{width:64px;flex:none;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000;outline:2px solid transparent;outline-offset:-2px}

<script>
"use strict";
// Installable app: browsers only allow service workers (and so the "Install app" option) on https:// pages and on
// localhost, not on plain http://192.168... addresses. Where that rule allows it, register one.
if("serviceWorker" in navigator&&isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
/* ---------- SHA-256 (crypto.subtle is unavailable on plain http:// LAN pages) ---------- */
function sha256(msg){
  const K=[],H=[];
  for(let n=2,c=0;c<64;n++){let p=true;for(let f=2;f*f<=n;f++)if(n%f===0){p=false;break}
    if(p){const fr=x=>((x-Math.floor(x))*4294967296)|0;if(c<8)H[c]=fr(Math.pow(n,1/2));K[c++]=fr(Math.pow(n,1/3))}}
  const l=msg.length,bl=((l+9+63)>>6)<<6,b=new Uint8Array(bl);b.set(msg);b[l]=0x80;
  const dv=new DataView(b.buffer);dv.setUint32(bl-4,(l*8)>>>0);dv.setUint32(bl-8,Math.floor(l*8/4294967296));
  const W=new Int32Array(64);
  for(let i=0;i<bl;i+=64){
    for(let t=0;t<16;t++)W[t]=dv.getInt32(i+t*4);
    for(let t=16;t<64;t++){const x=W[t-15],y=W[t-2];
      W[t]=(W[t-16]+((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+W[t-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10)))|0}
    let[a,bb,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const t1=(h+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&f)^(~e&g))+K[t]+W[t])|0;
      const t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&bb)^(a&c)^(bb&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  const out=new Uint8Array(32),ov=new DataView(out.buffer);H.forEach((v,i)=>ov.setInt32(i*4,v));return out}
const b64=u8=>btoa(String.fromCharCode(...u8));
const sha64=s=>b64(sha256(new TextEncoder().encode(s)));

/* ---------- obs-websocket v5 client ---------- */
class OBS{
  constructor(){this.ws=null;this.id=0;this.pending=new Map();this.handlers={};this.ready=false;this.subs=1|4|8|16|64|512|1024|(1<<16)}
  // Subscriptions are set once, at login. Never change them with op 3 (Reidentify): obs-websocket 5.x
  // miscounts its volume-meter listeners when a Reidentify arrives as the connection closes (a phone
  // locking does exactly that). Each miss lowers the count for good, and once it's low enough OBS stops
  // sending levels to every client until OBS restarts.
  on(ev,fn){(this.handlers[ev]??=[]).push(fn)}
  off(ev,fn){this.handlers[ev]=(this.handlers[ev]||[]).filter(f=>f!==fn)}
  emit(ev,d){(this.handlers[ev]||[]).forEach(f=>{try{f(d)}catch(e){console.error(e)}})}
  connect(url,password){
    this.close();
    return new Promise((resolve,reject)=>{
      let ws;try{ws=new WebSocket(url,"obswebsocket.json")}catch(e){return reject(e)}
      this.ws=ws;let settled=false;
      // With OBS closed, Windows Firewall often drops the attempt silently instead of refusing it, so the browser
      // would wait ~20 s. Give up after 6 s (the retry loop tries again).
      const giveUp=setTimeout(()=>{if(!settled&&this.ws===ws)try{ws.close()}catch{}},6000);
      ws.onmessage=ev=>{
        const m=JSON.parse(ev.data);
        if(m.op===0){ // Hello
          const d={rpcVersion:1,eventSubscriptions:this.subs};
          if(m.d.authentication){const{salt,challenge}=m.d.authentication;d.authentication=sha64(sha64(password+salt)+challenge)}
          ws.send(JSON.stringify({op:1,d}));
        }else if(m.op===2){clearTimeout(giveUp);this.ready=true;settled=true;resolve();this.emit("open")}
        else if(m.op===5){this.emit(m.d.eventType,m.d.eventData||{});this.emit("*",m.d)}
        else if(m.op===7){const p=this.pending.get(m.d.requestId);if(!p)return;this.pending.delete(m.d.requestId);
          const st=m.d.requestStatus;st.result?p.res(m.d.responseData||{}):p.rej(Object.assign(new Error(st.comment||("OBS error "+st.code)),{code:st.code}))}
      };
      ws.onclose=ev=>{const was=this.ready;this.ready=false;
        this.pending.forEach(p=>p.rej(new Error("disconnected")));this.pending.clear();
        if(!settled){settled=true;reject(new Error(ev.code===4009?"Wrong OBS websocket password":"Can't reach OBS ("+ev.code+")"))}
        if(was)this.emit("close",ev)};
      ws.onerror=()=>{};
    })}
  // Closing on purpose (e.g. Connect on the Connection page) must also fail the requests still waiting for an answer:
  // the picture loop awaits one, and left pending it would wait forever (black picture until the page reloads).
  close(){if(this.ws){this.ws.onclose=null;try{this.ws.close()}catch{}this.ws=null}this.ready=false;
    this.pending.forEach(p=>p.rej(new Error("disconnected")));this.pending.clear()}
  call(requestType,requestData,timeout=10000){
    if(!this.ready)return Promise.reject(new Error("Not connected"));
    const requestId=String(++this.id);
    return new Promise((res,rej)=>{
      const t=setTimeout(()=>{if(this.pending.delete(requestId))rej(new Error("OBS didn't answer"))},timeout);
      this.pending.set(requestId,{res:v=>{clearTimeout(t);res(v)},rej:e=>{clearTimeout(t);rej(e)}});
      this.ws.send(JSON.stringify({op:6,d:{requestType,requestId,requestData}}))})}
  ptz(device,requestType,data={}){
    return this.call("CallVendorRequest",{vendorName:"obs-ptz",requestType,requestData:{device,...data}})
      .then(r=>{const d=r.responseData||{};if(d.error)throw new Error(d.message||d.error);return d})}
}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
/* ---------- icons ----------
   One line-icon style for the whole app: 24x24, 2 px strokes, round ends, drawn in the text colour.
   Static markup uses <i class="ic" data-i="name"></i>, filled in when the script starts. */
const svgI=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON={
  wifi:svgI('<path d="M2 8.8a15 15 0 0 1 20 0M5 12.4a10 10 0 0 1 14 0M8.5 15.9a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>'),
  monitor:svgI('<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  switcher:svgI('<rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="14" width="5" height="6" rx="1"/><rect x="9.5" y="14" width="5" height="6" rx="1"/><rect x="16" y="14" width="5" height="6" rx="1"/>'),
  mixer:svgI('<path d="M6 4v16M12 4v16M18 4v16"/><rect x="4" y="13" width="4" height="3" rx="1" fill="currentColor"/><rect x="10" y="7" width="4" height="3" rx="1" fill="currentColor"/><rect x="16" y="11" width="4" height="3" rx="1" fill="currentColor"/>'),
  camera:svgI('<path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/>'),
  phone:svgI('<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/>'),
  info:svgI('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  more:svgI('<circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/>'),
  sliders:svgI('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'),
  back:svgI('<path d="M15 5l-7 7 7 7"/>'),
  qr:svgI('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>'),
  star:svgI('<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.4l-5.6 2.9 1.1-6.2L3 9.7l6.2-.9z"/>'),
  starOn:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.4l-5.6 2.9 1.1-6.2L3 9.7l6.2-.9z"/></svg>',
  gauge:svgI('<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/>'),
  dpad:svgI('<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>'),

const YT_CATEGORY=[["17","Sports"],["19","Travel and Events"],["20","Gaming"],["22","People and blogs"],["23","Comedy"],["24","Entertainment"],
  ["25","News and Politics"],["26","How-to and Style"],["27","Education"],["28","Science and Technology"],["29","Non-profits and Activism"]];
const ytParam=n=>obs.call("GetProfileParameter",{parameterCategory:"YouTube",parameterName:n}).then(r=>r.parameterValue??"");
async function ytAccount(){
  try{const s=(await obs.call("GetStreamServiceSettings")).streamServiceSettings||{};
    // Signed in = OBS keeps a YouTube login for this profile. (Not "no stream key": after a broadcast OBS keeps
    // that broadcast's key in the settings.) If OBS turns out to have no Manage Broadcast button, youtube.ps1 says
    // noAccount and the phone just starts the stream.
    if(!/youtube/i.test(s.service||""))return null;
    const auth=(await obs.call("GetProfileParameter",{parameterCategory:"Auth",parameterName:"Type"})).parameterValue||"";
    if(!/youtube/i.test(auth))return null;
    // the dialog is filled in by this page's own server, so it must be running on the OBS PC
    const r=await fetch("/api/obs",{cache:"no-store"});if(!r.ok||(await r.json()).running===null)return null;
    const k=["Title","Description","Privacy","CategoryID","Latency","MadeForKids","DVR","ChannelName"];
    const v=Object.fromEntries(await Promise.all(k.map(async n=>[n,await ytParam(n)])));
    return v.ChannelName?v:null}  // OBS saves the channel name when it signs in
  catch{return null}}
function ytSheet(v){
  const opts=(list,cur,def)=>{const c=list.some(x=>x[0]===cur)?cur:def;return list.map(([k,n])=>`<option value="${k}"${k===c?" selected":""}>${n}</option>`).join("")};
  const on=x=>/^(true|1)$/i.test(x);
  sheet(`<h3>Go live on YouTube</h3><p>${v.ChannelName?`Channel: ${esc(v.ChannelName)}. `:""}OBS needs these before it can start. They're filled in on the PC for you.</p>
    <div class="field"><label for="ytTitle">Title</label><input id="ytTitle" maxlength="100" value="${esc(v.Title||"")}"></div>
    <div class="field"><label for="ytDesc">Description</label><textarea id="ytDesc" maxlength="5000">${esc(v.Description||"")}</textarea></div>
    <div class="ytrow"><div class="field"><label for="ytPriv">Privacy</label><select id="ytPriv">${opts(YT_PRIVACY,v.Privacy,"public")}</select></div>
      <div class="field"><label for="ytLat">Latency</label><select id="ytLat">${opts(YT_LATENCY,v.Latency,"normal")}</select></div></div>
    <div class="field"><label for="ytCat">Category</label><select id="ytCat">${opts(YT_CATEGORY,v.CategoryID,"29")}</select></div>
    <label class="tog"><span><b>Made for kids</b><small>YouTube's audience setting</small></span><input type="checkbox" class="sw" id="ytKids"${on(v.MadeForKids)?" checked":""}></label>
    <label class="tog"><span><b>Let viewers rewind</b><small>YouTube's DVR option</small></span><input type="checkbox" class="sw" id="ytDvr"${v.DVR===""||on(v.DVR)?" checked":""}></label>
    <div class="btns"><button data-close>Cancel</button><button class="danger" id="ytGo">Go live</button></div>`,
    close=>$("ytGo").onclick=()=>{const t=$("ytTitle").value.trim();if(!t){toast("Give the broadcast a title",true);return $("ytTitle").focus()}
      const pick=(list,id)=>list.find(x=>x[0]===$(id).value);
      ytGoLive({title:t,description:$("ytDesc").value,privacy:pick(YT_PRIVACY,"ytPriv"),latency:pick(YT_LATENCY,"ytLat"),
        category:pick(YT_CATEGORY,"ytCat"),kids:$("ytKids").checked,dvr:$("ytDvr").checked})})}
let ytBusy=false;  // one Go live at a time: a second tap mustn't run the PC's dialog again
async function ytGoLive(f){if(ytBusy)return;buzz();
  const lock=on=>on?$("scrim").dataset.lock=1:delete $("scrim").dataset.lock;
  sheet(`<h3>Going live…</h3><p>Setting up the broadcast in OBS on the PC. This takes a few seconds.</p>`);lock(true);
  ytBusy=true;
  try{
    const r=await fetch("/api/youtube/golive",{method:"POST",headers:{"X-OBS-Remote":"1","X-OBS-Remote-Key":sha64("obs-remote-listen:"+cfg.pw),"Content-Type":"application/json"},
      body:JSON.stringify({title:f.title,description:f.description,privacy:f.privacy[0],category:f.category[0],latency:f.latency[0],kids:f.kids,dvr:f.dvr,dryRun:!!f.dryRun})});
    const j=await r.json().catch(()=>({}));
    if(j.noAccount&&!f.dryRun){await obs.call("StartStream");lock(false);$("scrim").classList.remove("show");return toast("Stream starting")}
    if(!r.ok||!j.ok){
      // The stream is what counts: if OBS is live anyway (the dialog was finished some other way), say so.
      // (give it a few seconds: OBS connects to YouTube just after the PC side finishes)
      let live=false;
      for(let i=0;i<8&&!f.dryRun&&!live;i++){live=await obs.call("GetStreamStatus").then(x=>x.outputActive).catch(()=>false);if(!live)await new Promise(z=>setTimeout(z,750))}
      if(!live)throw new Error(j.error||`The OBS PC said ${r.status}`)}
    lock(false);$("scrim").classList.remove("show");toast(f.dryRun?j.error:"Going live on YouTube")}
  catch(e){lock(false);sheet(`<h3>Couldn't go live</h3><p>${esc(e.message)}</p><div class="btns one"><button data-close>OK</button></div>`)}
  finally{ytBusy=false}}
obs.on("StreamStateChanged",()=>loadOutputs().catch(()=>{}));
obs.on("RecordStateChanged",()=>loadOutputs().catch(()=>{}));

/* Advanced Scene Switcher (obs-advanced-scene-switcher plugin): start/stop its automatic scene switching.
   S.ass = true/false when OBS has the plugin, null when it doesn't (nothing about it is shown). Its switch is
   in the ⋮ menu. */
const ASS="AdvancedSceneSwitcher";S.ass=null;
async function loadAss(){
  try{S.ass=!!(await obs.call("CallVendorRequest",{vendorName:ASS,requestType:"IsAdvancedSceneSwitcherRunning",requestData:{}})).responseData?.isRunning}
  catch{S.ass=null}
  if(!$("menu").hidden)renderMenu();
}
function toggleAss(){
  const on=!S.ass,go=()=>obs.call("CallVendorRequest",{vendorName:ASS,requestType:on?"AdvancedSceneSwitcherStart":"AdvancedSceneSwitcherStop",requestData:{}})
    .then(()=>{S.ass=on;if(!$("menu").hidden)renderMenu();toast(on?"Advanced scene switcher on":"Advanced scene switcher off")}).catch(fail).finally(()=>setTimeout(loadAss,800));
  if(on&&S.stream?.outputActive){closeMenu();confirmSheet("Turn on Advanced scene switcher?","You're live: it may change the program scene straight away, following its rules in OBS.","Turn on",false,go)}
  else go();
}
obs.on("VendorEvent",d=>{if(d.vendorName===ASS&&/^AdvancedSceneSwitcher(Started|Stopped)$/.test(d.eventType)){S.ass=d.eventType.endsWith("Started");if(!$("menu").hidden)renderMenu()}});
setInterval(()=>{if(obs.ready&&!document.hidden&&S.ass!==null)loadAss()},10000);  // in case an event was missed

/* ---------- audio ---------- */
async function loadAudio(){
  const [{inputs},special]=await Promise.all([obs.call("GetInputList"),obs.call("GetSpecialInputs")]);
  const sp=new Set(Object.values(special).filter(Boolean));
  // OBS_SOURCE_AUDIO is a per-type flag, so every browser source claims audio. Like OBS's own mixer,
  // only count a browser source when its "Control audio via OBS" (reroute_audio) box is ticked.
  const cand=inputs.filter(i=>(i.inputKindCaps&2));
  const keep=await Promise.all(cand.map(i=>i.unversionedInputKind!=="browser_source"?true
    :obs.call("GetInputSettings",{inputName:i.inputName}).then(r=>r.inputSettings?.reroute_audio===true).catch(()=>false)));
  const aud=cand.filter((_,k)=>keep[k]);
  const [mutes,mons,vols]=await Promise.all([
    Promise.all(aud.map(i=>obs.call("GetInputMute",{inputName:i.inputName}).then(r=>r.inputMuted).catch(()=>null))),
    Promise.all(aud.map(i=>obs.call("GetInputAudioMonitorType",{inputName:i.inputName}).then(r=>r.monitorType).catch(()=>""))),
    Promise.all(aud.map(i=>obs.call("GetInputVolume",{inputName:i.inputName}).then(r=>r.inputVolumeMul).catch(()=>1)))]);
  S.audio=aud.map((i,k)=>({name:i.inputName,muted:mutes[k],mon:mons[k],vol:vols[k],special:sp.has(i.inputName)})).filter(a=>a.muted!==null);
  await loadMixerHidden();
  renderAudio();
}
// Sources hidden in OBS's own Audio Mixer stay hidden here too. obs-websocket can't see that flag, so the
// server on the OBS PC reads it from the scene collection file (/api/mixer-hidden). Without the server: none.
S.mixerHidden=new Set();
async function loadMixerHidden(){
  try{const {currentSceneCollectionName:c}=await obs.call("GetSceneCollectionList");
    const r=await fetch("/api/mixer-hidden?collection="+encodeURIComponent(c),{cache:"no-store"});
    if(r.ok)S.mixerHidden=new Set((await r.json()).hidden||[])}catch{}
}
// OBS writes the file when it saves the collection, so look again now and then
setInterval(()=>{if(obs.ready&&!document.hidden&&S.tab==="tabAudio"&&S.audio)loadMixerHidden().then(renderAudio)},30000);
function renderAudio(){
  const list=S.audio.filter(a=>!S.mixerHidden.has(a.name)&&(S.showAllAudio||a.special||S.liveSources.has(a.name)));
  $("btnAllAudio").textContent=S.showAllAudio?"Live only":"Show all";
  const bar=`<div class="mbar"><i class="cv"></i><i class="hd"></i></div>`;
  $("audio").innerHTML=list.length?list.map(a=>`<div class="arow"><div class="ainfo"><div class="atop"><span class="n">${esc(a.name)}</span><span class="db">−∞ dB</span></div>
      <div class="meter${a.muted?" muted":""}" data-meter="${esc(a.name)}">${bar}${bar}</div></div>
      <button class="amon${monOn(a)?" on":""}" data-mon="${esc(a.name)}" aria-label="Monitor ${esc(a.name)}" title="${monOn(a)?"Heard when you Listen":"Not heard when you Listen"}">${ICON.headphones}</button>
      <button class="mute${a.muted?" muted":""}" data-mute="${esc(a.name)}">${a.muted?ICON.volOff+"Muted":ICON.speaker+"On"}</button></div>`).join("")
    :`<div class="empty">${obs.ready?"No audio sources in the live scene.":"Not connected to OBS."}</div>`;
  renderListen();
}
$("btnAllAudio").onclick=()=>{S.showAllAudio=!S.showAllAudio;renderAudio()};
$("audio").addEventListener("click",e=>{const m=e.target.closest("[data-mon]");if(m){buzz();toggleMonitor(m.dataset.mon);return}
  const b=e.target.closest("[data-mute]");if(!b)return;buzz();obs.call("ToggleInputMute",{inputName:b.dataset.mute}).catch(fail)});
// volume meters: OBS sends InputVolumeMeters ~20x/s ([magnitude, peak, inputPeak] per channel, linear).
// Always subscribed (see OBS.subs); about 9 KB/s, ignored while the Audio tab isn't on screen.
const LV={};
const toDb=m=>m>0?20*Math.log10(m):-100;
// A muted source's level is zeroed in [1], but [2] (before the fader) isn't: like OBS's own mixer, show that
// times the fader, greyed out by the .muted style.
obs.on("InputVolumeMeters",d=>{if(S.tab!=="tabAudio"||document.hidden)return;const now=performance.now();
  for(const i of d.inputs){const L=LV[i.inputName]??={ch:[{db:-100,hold:-100,holdT:0},{db:-100,hold:-100,holdT:0}],at:0};
    const chs=i.inputLevelsMul;if(!chs.length)continue;L.at=now;
    const a=S.audio.find(x=>x.name===i.inputName),muted=a&&a.muted,vol=a&&a.vol!=null?a.vol:1;
    for(let k=0;k<2;k++){const c=chs[Math.min(k,chs.length-1)],p=toDb(muted?c[2]*vol:c[1]),s=L.ch[k]; // mono -> both bars
      if(p>s.db)s.db=p;if(p>=s.hold){s.hold=p;s.holdT=now}}}});
let meterLast=performance.now();
(function meterLoop(now){
  const dt=Math.min((now-meterLast)/1000,0.25);meterLast=now;
  if(S.tab==="tabAudio"&&!document.hidden)for(const m of document.querySelectorAll("[data-meter]")){
    const L=LV[m.dataset.meter],live=L&&now-L.at<1000;m.classList.toggle("idle",!live);
    const bars=m.children;let top=-100;
    for(let k=0;k<2;k++){const s=live?L.ch[k]:{db:-100,hold:-100,holdT:0};
      if(live){s.db=Math.max(s.db-26*dt,-100);if(now-s.holdT>1500)s.hold=Math.max(s.hold-20*dt,s.db)} // OBS-like fall-off + 1.5 s peak hold
      const pct=x=>Math.min(Math.max((x+60)/60,0),1);
      bars[k].firstChild.style.transform=`scaleX(${1-pct(s.db)})`;
      const hd=bars[k].lastChild;hd.style.left=pct(s.hold)*100+"%";hd.style.opacity=s.hold>-60?.9:0;
      top=Math.max(top,s.hold)}
    m.previousElementSibling.lastChild.textContent=top>-60?`${top.toFixed(1)} dB`:"−∞ dB"}
  requestAnimationFrame(meterLoop)})(performance.now());
obs.on("InputAudioMonitorTypeChanged",d=>{const a=S.audio.find(x=>x.name===d.inputName);if(a){a.mon=d.monitorType;renderAudio()}});
obs.on("InputVolumeChanged",d=>{const a=S.audio.find(x=>x.name===d.inputName);if(a)a.vol=d.inputVolumeMul});
obs.on("InputMuteStateChanged",d=>{const a=S.audio.find(x=>x.name===d.inputName);if(a){a.muted=d.inputMuted;renderAudio()}});
["InputCreated","InputRemoved","InputNameChanged"].forEach(ev=>obs.on(ev,()=>loadAudio().catch(()=>{})));
// ticking/unticking "Control audio via OBS" in OBS updates the list straight away
obs.on("InputSettingsChanged",d=>{if("reroute_audio" in (d.inputSettings||{}))loadAudio().catch(()=>{})});
obs.on("SourceFilterSettingsChanged",d=>{const dev=S.devices.find(x=>x.source===d.sourceName);if(dev)loadCaps(dev.source).then(c=>dev.caps=c)});

/* ---------- monitors (OBS-rendered frames) ----------
   A GetSourceScreenshot costs OBS ~8 ms and doesn't disturb its render loop (measured), so we pull
   frames back-to-back up to the Picture setting's rate. Only one request per monitor is in flight, so a
   slow Wi-Fi link just lowers the frame rate instead of piling up. Each frame is decoded off-screen
   before it is swapped in, so there is no flicker. */
const FPS={smooth:25,balanced:10,saver:2};
const shotErr={},fpsCount={},keyAt={};
async function frame(src,imgId,w,q,still){
  if(!src||(shotErr[src]&&performance.now()-shotErr[src]<1500))return; // e.g. camera offline: retry slowly
  let r;try{r=await obs.call("GetSourceScreenshot",{sourceName:src,imageFormat:"jpg",imageWidth:w,imageCompressionQuality:q})}
  catch{shotErr[src]=performance.now();return}
  delete shotErr[src];
  // decode() can stall (e.g. a backgrounded tab); never let it hold up the picture loop for more than 2 s
  const im=new Image();im.src=r.imageData;
  try{await Promise.race([im.decode(),sleep(2000).then(()=>{throw new Error("decode timeout")})])}catch{return}
  // the user may have switched camera while this frame was on its way: don't show the old camera
  if(still&&!still())return;
  const old=$(imgId);if(!old)return;im.id=imgId;im.alt="";old.replaceWith(im);
  fpsCount[imgId]=(fpsCount[imgId]||0)+1;
  // program and preview keys follow the monitors (at most twice a second)
  if(imgId!=="imgCam"&&performance.now()-(keyAt[imgId]||0)>500){keyAt[imgId]=performance.now();setThumb(src,r.imageData)}
}
async function shotLoop(){
  for(;;){
    if(!obs.ready||document.hidden||S.tab==="tabAudio"){await sleep(300);continue}
    const t0=performance.now();
    if(S.tab==="tabLive")await Promise.all([frame(S.program,"imgPgm",480,55),S.studio&&frame(S.preview,"imgPvw",480,55)]);
    else{const d=curDev();if(d){const src=picOf(d);await frame(src,"imgCam",640,62,()=>S.tab==="tabCam"&&picOf(curDev())===src)}else await sleep(300)}
    const wait=1000/(FPS[S.quality]||25)-(performance.now()-t0);
    await sleep(Math.max(wait,4));
  }
}
setInterval(()=>{ // small fps readout on each monitor
  for(const id of ["imgPgm","imgPvw","imgCam"]){const el=$(id+"Fps");if(el)el.textContent=fpsCount[id]?fpsCount[id]+" fps":"";fpsCount[id]=0}},1000);

/* ---------- PTZ ---------- */
const curDev=()=>S.devices.find(d=>d.device===S.dev);
async function loadDevices(){
  // obs-ptz only has a websocket API from v0.20.0-pre5 / the 1.0 betas. The stable 0.19.x has none, so OBS answers
  // "vendor not found" (code 600) and the Camera tab can't work; say so instead of "no cameras".
  S.ptzMissing=false;
  const r=await obs.call("CallVendorRequest",{vendorName:"obs-ptz",requestType:"ptz_list_devices",requestData:{}})
    .catch(e=>{S.ptzMissing=e.code===600||/vendor/i.test(e.message);return null});
  const devs=r?.responseData?.devices||[];
  S.videoInputs=((await obs.call("GetInputList").catch(()=>({inputs:[]}))).inputs||[])
    .filter(i=>i.inputKindCaps===undefined||(i.inputKindCaps&1)).map(i=>i.inputName);
  S.camCfg=await loadCamCfg();
  S.devices=await Promise.all(devs.map(async d=>{
    const [st,caps]=await Promise.all([obs.ptz(d.device,"ptz_get_state").catch(()=>({state:{}})),loadCaps(d.source)]);
    return{device:d.device,source:d.source,kind:d.name,state:st.state||{},caps,auto:await autoPicture(d.source)}}));
  S.devices.sort((a,b)=>nameOf(a).localeCompare(nameOf(b),undefined,{numeric:true,sensitivity:"base"}));
  if(!curDev()&&S.devices.length)S.dev=(S.devices.find(d=>d.state.connected)||S.devices[0]).device;
  renderCams();await loadPresets();
}
// obs-ptz clamps every move to the camera's own max speed (PTZ filter → Speed settings), it doesn't scale.
// e.g. a camera capped at 0.15 would hit the cap at ~15% on a raw 0..1 slider, and the rest of the slider would do nothing.
// Read the caps and scale into them instead: the slider now runs from slow to that camera's max.
async function loadCaps(source){
  const r=await obs.call("GetSourceFilterList",{sourceName:source}).catch(()=>null);
  const f=(r?.filters||[]).find(x=>/^ca\.secretlab\.obs-ptz\./.test(x.filterKind));
  const st=f?.filterSettings||{},n=(k,alt)=>{const v=st[k]??st[alt];return v>0?v:1};
  return{pan:n("pan_speed_max","pantilt_speed_max"),tilt:n("tilt_speed_max","pantilt_speed_max"),zoom:n("zoom_speed_max"),focus:n("focus_speed_max")};
}
const capOf=k=>curDev()?.caps?.[k]??1;
// The PTZ control can sit on a different source from the picture, e.g. VISCA on a hidden webcam source "CAM01"
// while the scene shows "CAM01-NDI". If the PTZ source isn't producing video, use an active source whose name
// starts with the same name.
async function autoPicture(source){
  const active=n=>obs.call("GetSourceActive",{sourceName:n}).then(r=>r.videoActive||r.videoShowing).catch(()=>false);
  if(await active(source))return source;
  const low=source.toLowerCase();
  for(const n of (S.videoInputs||[]).filter(n=>n!==source&&n.toLowerCase().startsWith(low)))if(await active(n))return n;
  return source;
}
// Names and picture sources saved in OBS by earlier versions (Settings → Cameras) are still honoured, so a camera
// set up that way keeps working. The app no longer edits them: cameras otherwise show their OBS source names.
const CAMCFG={realm:"OBS_WEBSOCKET_DATA_REALM_PROFILE",slotName:"obs-remote.cameras"};
async function loadCamCfg(){
  const r=await obs.call("GetPersistentData",CAMCFG).catch(()=>null);const v=r?.slotValue;
  return{names:v?.names||{},pictures:v?.pictures||{}};
}
const nameOf=d=>d?(S.camCfg?.names?.[d.source]||d.source):"";
const picOf=d=>d?(S.camCfg?.pictures?.[d.source]||d.auto||d.source):"";
const isLive=d=>!!d&&(S.liveSources.has(d.source)||S.liveSources.has(picOf(d)));
function renderCams(){
  $("camList").innerHTML=S.devices.length?S.devices.map(d=>`<button class="chip${d.device===S.dev?" sel":""}" data-dev="${d.device}"><span class="dot ${d.state.connected?"ok":""}"></span>${esc(nameOf(d))}${isLive(d)?'<span class="air">ON AIR</span>':""}</button>`).join("")
    :S.ptzMissing?`<div class="empty">OBS has no PTZ control for this app. It needs obs-ptz <b>1.0 (beta)</b> or newer with Settings → Websocket access = “Control”. The stable 0.19.x release has no websocket control. Everything on the Switcher still works.</div>`
    :`<div class="empty">${obs.ready?"No PTZ cameras found. Is the obs-ptz plugin loaded, with websocket access set to “Control”?":"Not connected to OBS."}</div>`;
  const d=curDev();
  $("onair").classList.toggle("show",isLive(d));
  $("camMon").classList.toggle("pgm",isLive(d));
  if(d){const f=d.state.features||{};
    const pn=picOf(d)!==d.source?` (picture: ${picOf(d)})`:"";
    $("camState").textContent=(d.state.connected?`${nameOf(d)} · ${d.kind.replace(" PTZ Control","")}`:`${nameOf(d)} · camera not connected`)+pn;
    $("focusRow").hidden=!f.focus;
    $("afL").textContent=f.autofocus?(d.state.focus_af_enabled===false?"Manual focus":"Auto focus"):"Auto focus";
    $("btnAF").classList.toggle("on",!!f.autofocus&&d.state.focus_af_enabled!==false);
    $("btnAF").title=$("btnAF").ariaLabel=f.autofocus?(d.state.focus_af_enabled===false?"Auto focus is off: tap to turn it on":"Auto focus is on: tap to turn it off"):"Auto focus";
    $("btnAF").disabled=!f.autofocus;
    document.querySelectorAll("[data-zoom]").forEach(b=>b.disabled=!f.zoom);
  }else $("camState").textContent="";
  $("camPrev").hidden=$("camNext").hidden=S.devices.length<2;
  camInd();
  renderAudio();camFade();if(S.tab==="tabCam")camNudge();
  if(!$("menu").hidden)renderMenu();
}
// Highlight behind the selected chip. renderCams() rebuilds the chips, so start it where it was and let it slide.
// One highlight element for the life of the page (only the chip list is rebuilt), so a slide in progress
// carries on even when a camera's state update re-renders the chips mid-way.
function camInd(jump){const c=$("cams"),ind=c.querySelector(".ind"),list=$("camList"),sel=list.querySelector(".chip.sel");
  if(!sel){ind.hidden=true;return}
  if(!sel.offsetWidth)return;  // tab hidden: placed when it's shown
  // the dark copy of the row, lined up with the real one (no ids, no data-dev: it's only paint)
  const t=ind.firstElementChild;t.innerHTML=list.innerHTML;t.querySelectorAll(".chip").forEach(x=>{x.classList.remove("sel");x.removeAttribute("data-dev");x.tabIndex=-1});
  t.style.left=list.offsetLeft+"px";t.style.top=list.offsetTop+"px";
  jump=jump||ind.hidden;ind.hidden=false;
  ind.classList.toggle("drag",!!jump);   // first showing / resize: place it without sliding
  placeInd(sel.offsetLeft,sel.offsetTop,sel.offsetWidth,sel.offsetHeight);
  if(jump){ind.offsetWidth;ind.classList.remove("drag")}}
// transform + width only (no left/top), so the browser can slide it smoothly; the dark copy moves the other way
function placeInd(x,y,w,h){const ind=$("cams").querySelector(".ind");
  ind.style.transform=`translate(${x}px,${y}px)`;ind.style.width=w+"px";ind.style.height=h+"px";

  P.addEventListener("pointermove",e=>{if(timer&&startXY&&Math.hypot(e.clientX-startXY[0],e.clientY-startXY[1])>12){clearTimeout(timer);timer=null}});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>P.addEventListener(ev,()=>{clearTimeout(timer);timer=null}));
  P.addEventListener("contextmenu",e=>e.preventDefault());
  P.addEventListener("click",e=>{const b=e.target.closest("[data-preset]");if(!b||fired)return;const d=curDev();if(!d)return;buzz();
    document.querySelectorAll("#presets .key.hit").forEach(x=>x.classList.remove("hit"));b.classList.add("hit");
    obs.ptz(d.device,"ptz_preset_recall",{id:b.dataset.preset}).catch(fail)});
})();
function savePreset(id){
  const d=curDev();if(!d)return;const p=(S.presets[d.device]||[]).find(x=>x.id===id);
  confirmSheet(`Overwrite “${p?.name||id}”?`,`Saves ${nameOf(d)}'s current position into this preset. The old position is lost.`,"Save position",false,
    async()=>{try{await obs.ptz(d.device,"ptz_preset_save",{id});delete S.thumbs[d.device+"|"+id];
      await obs.ptz(d.device,"ptz_preset_capture_thumbnail",{id,if_arrived:false}).catch(()=>{});
      toast("Preset saved");setTimeout(loadPresets,800)}catch(e){fail(e)}});
}

/* ---------- listen on the phone ---------- */
// The server on the OBS PC records OBS's audio monitoring device (Settings → Audio → Advanced) and streams it as
// raw 24 kHz mono 16-bit PCM (listen.py). Only sources set to monitor in OBS are heard: the headphone button on
// each audio row switches a source between "Monitor Off" and "Monitor and Output".
// Nothing plays, and the server records nothing, until someone taps Listen.
const monOn=a=>a.mon==="OBS_MONITORING_TYPE_MONITOR_AND_OUTPUT"||a.mon==="OBS_MONITORING_TYPE_MONITOR_ONLY";
function toggleMonitor(name){const a=S.audio.find(x=>x.name===name);if(!a)return;
  obs.call("SetInputAudioMonitorType",{inputName:name,monitorType:monOn(a)?"OBS_MONITORING_TYPE_NONE":"OBS_MONITORING_TYPE_MONITOR_AND_OUTPUT"}).catch(fail)}
const LISTEN_RATE=24000;
const player={ctx:null,ctrl:null,next:0,on:false,
  async start(){
    if(this.on)return;
    try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch{} // iPhone: play even with the silent switch on
    this.ctx??=new (window.AudioContext||window.webkitAudioContext)();
    this.ctx.resume();  // must happen inside the tap
    this.on=true;this.next=0;renderListen();
    const ctrl=this.ctrl=new AbortController();
    try{
      const r=await fetch("/api/listen",{headers:{"X-OBS-Remote-Key":sha64("obs-remote-listen:"+cfg.pw)},signal:ctrl.signal,cache:"no-store"});
      if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||`The OBS PC said ${r.status}`);
      const rd=r.body.getReader();let rest=null;
      for(;;){const {value,done}=await rd.read();if(done)break;
        let b=value;if(rest){const m=new Uint8Array(rest.length+b.length);m.set(rest);m.set(b,rest.length);b=m;rest=null}
        if(b.length&1){rest=b.slice(-1);b=b.subarray(0,b.length-1)}
        if(b.length)this.play(new Int16Array(b.slice().buffer))}
      if(ctrl===this.ctrl){const st=await (await fetch("/api/listen-state",{cache:"no-store"})).json().catch(()=>({}));
        throw new Error(st.error?`Can't record ${st.device||"the monitoring device"}: ${st.error}`:"Listening stopped")}
    }catch(e){if(ctrl===this.ctrl&&e.name!=="AbortError")toast(e.message,true)}
    finally{if(ctrl===this.ctrl)this.stop()}},
  play(i16){const c=this.ctx,n=i16.length,buf=c.createBuffer(1,n,LISTEN_RATE),ch=buf.getChannelData(0);
    for(let k=0;k<n;k++)ch[k]=i16[k]/32768;
    const src=c.createBufferSource();src.buffer=buf;src.connect(c.destination);const now=c.currentTime;
    // ~150 ms cushion against Wi-Fi hiccups; if it grows past 600 ms, skip ahead so the delay stays short
    if(this.next<now+0.03||this.next>now+0.6)this.next=now+0.15;
    src.start(this.next);this.next+=n/LISTEN_RATE},
  stop(){this.on=false;const c=this.ctrl;this.ctrl=null;try{c&&c.abort()}catch{}renderListen()}};
function renderListen(){const b=$("btnListen");b.hidden=false;$("listenNote").hidden=false;
  b.classList.toggle("on",player.on);b.innerHTML=`${ICON.headphones}${player.on?"Stop":"Listen"}`;$("listening").hidden=!player.on}
$("btnListen").onclick=()=>{buzz();player.on?player.stop():player.start()};
addEventListener("pagehide",()=>player.stop());

/* ---------- tabs ---------- */
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>{
  stopMove();S.tab=b.dataset.tab;closeMenu();
  document.querySelectorAll("nav [data-tab]").forEach(x=>x.classList.toggle("sel",x===b));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("sel",t.id===S.tab));
  if(S.tab==="tabCam"&&obs.ready)loadDevices().catch(fail);
  if(S.tab==="tabCam")requestAnimationFrame(()=>{camInd();camFade();camNudge();camWake()});
  if(S.tab==="tabLive")loadSceneThumbs();
  if(S.tab==="tabAudio"&&obs.ready)loadMixerHidden().then(renderAudio);
  window.scrollTo(0,0)});

/* ---------- ⋮ menu: stats, scene switcher, refresh camera, settings ---------- */
function renderMenuStats(){const el=$("mStats");if(!el)return;const p=statsParts();
  el.innerHTML=p?`<div><b>${p.cpu}</b><span>CPU</span></div><div><b>${p.fps}</b><span>fps</span></div><div><b>${p.dropped}</b><span>Dropped</span></div>`:`<div><b>–</b><span>CPU</span></div><div><b>–</b><span>fps</span></div><div><b>–</b><span>Dropped</span></div>`;
  const x=p?.extra||[];$("mStatsX").innerHTML=x.map(([l,v])=>`<div>${esc(l)}<b>${esc(v)}</b></div>`).join("");$("mStatsX").hidden=!x.length}
function renderMenu(){
  const m=$("menu"),d=curDev(),upd=!!(S.upd?.update&&!S.upd.blocked);
  m.innerHTML=(obs.ready?`<div class="mstatsw"><div class="mstats" id="mStats"></div><div class="mstats-x" id="mStatsX" hidden></div></div>`:"")
    +(obs.ready&&S.ass!==null?`<label class="mi">${ICON.shuffle}<span class="grow">Scene switcher<small>${S.ass?"On: OBS switches scenes by itself":"Off: scenes change only when you switch them"}</small></span><input type="checkbox" class="sw" id="mAss"${S.ass?" checked":""}></label>`:"")
    +(obs.ready&&S.tab==="tabCam"&&d?`<button class="mi" id="mRefresh">${ICON.refresh}<span class="grow">Refresh camera<small>Reconnect ${esc(nameOf(d))}'s picture and control</small></span></button>`:"")
    +`<button class="mi" id="mSettings">${ICON.sliders}<span class="grow">Settings</span>${upd?'<span class="bdot"></span>':""}</button>`;
  renderMenuStats();
  if($("mAss"))$("mAss").onchange=e=>{e.target.checked=!!S.ass;toggleAss()};
  if($("mRefresh"))$("mRefresh").onclick=()=>{closeMenu();refreshCamera()};
  $("mSettings").onclick=()=>{closeMenu();openSettings()}}
function openMenu(){renderMenu();$("menu").hidden=false;if(obs.ready)loadOutputs(true).catch(()=>{})}
function closeMenu(){$("menu").hidden=true}
$("btnMore").onclick=e=>{e.stopPropagation();buzz();$("menu").hidden?openMenu():closeMenu()};
document.addEventListener("click",e=>{if(!$("menu").hidden&&!e.target.closest("#menu,#btnMore"))closeMenu()});

/* ---------- full-screen pages ---------- */
const pageState={pg1:null,pg2:null};  // which page each layer shows, so it can be redrawn when something changes
function page(id,kind,title,body,{back=true,act="",bind}={}){
  const el=$(id),keep=pageState[id]===kind&&el.classList.contains("show")?el.querySelector(".pbody")?.scrollTop:0;
  pageState[id]=kind;
  el.innerHTML=`<div class="ph"><div class="wrap">${back?`<button class="back" aria-label="Back">${ICON.back}</button>`:'<span style="width:8px"></span>'}<h3>${title}</h3>${act}</div></div><div class="pbody"><div class="wrap">${body}</div></div>`;
  el.classList.add("show");el.querySelector(".pbody").scrollTop=keep||0;
  if(back)el.querySelector(".back").onclick=()=>closePage(id);
  bind&&bind(el)}
function closePage(id){$(id).classList.remove("show");pageState[id]=null;if(id==="pg2"&&pageState.pg1==="settings")openSettings()}
// (the Connection page isn't redrawn: that would wipe a password half typed in)
function renderPageIfOpen(){if(pageState.pg1==="settings")openSettings();if(pageState.pg2==="scenes")openScenes()}
// Escape / the phone's back gesture on a page closes it
addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("menu").hidden)return closeMenu();
  if($("scrim").classList.contains("show")&&!$("scrim").dataset.lock)return $("scrim").classList.remove("show");
  if(pageState.pg2&&!(forced&&pageState.pg2==="connection"))return closePage("pg2");if(pageState.pg1&&!forced)closePage("pg1")});

/* Settings: who a change affects decides where it sits. Changes apply at once; only Connect has a button. */
const QNOTE={smooth:"25 fps. About 5 Mbit/s of Wi-Fi while a picture is on screen.",balanced:"10 fps. Fine on most Wi-Fi.",saver:"2 fps. Use this on mobile data."};
const segH=(key,opts)=>`<div class="seg" data-set="${key}" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(([v,t])=>`<button data-v="${v}" class="${S[key]===v?"sel":""}">${t}</button>`).join("")}</div>`;
function openSettings(){
  const u=S.upd,upd=u?.update&&!u.blocked;
  page("pg1","settings","Settings",`
    ${upd?`<div class="updc"><div><b>Version ${esc(u.latest)} is ready</b><span>You have ${esc(u.version)}. OBS keeps running while it updates.</span></div><button id="sUpdate">Update</button></div>`:""}
    <div class="sl">${ICON.wifi}Connection</div>
    <div class="list"><button class="row nav" id="sConn"><span class="cdot${obs.ready?"":" off"}"></span><span class="grow">${obs.ready?`Connected to ${esc(cfg.host)}`:S.conn==="wait"?"Connecting…":"Not connected"}<small>${obs.ready?esc(S.collection||"OBS")+" · "+viaText():"Tap to check the PC's address and password"}</small></span></button></div>
    <div class="sl">${ICON.phone}This phone</div>
    <div class="list">
      <div class="rowx"><b>Picture</b>${segH("quality",[["smooth","Smooth"],["balanced","Balanced"],["saver","Data saver"]])}</div>
      <div class="rowx"><b>Camera controls</b>${segH("ctrl",[["buttons","Buttons"],["joystick","Joystick"]])}</div>
    </div>
    <div class="foot" id="qNote">${QNOTE[S.quality]||""}</div>
    ${obs.ready?`<div class="sl">${ICON.monitor}OBS <span class="who">Changes it for every phone</span></div>
    <div class="list">
      <label class="row"><span class="grow">Studio Mode<small>${S.studio?"Preview a scene first, then TAKE it":"Off: tapping a scene puts it straight on air"}</small></span><input type="checkbox" class="sw" id="sStudio"${S.studio?" checked":""}></label>
      <label class="row" id="sFixRow" hidden><span class="grow">Fix frozen NDI cameras<small id="sFixInfo"></small></span><input type="checkbox" class="sw" id="sFix"></label>
    </div>
    <div class="foot" id="sFixFoot" hidden>Runs on the OBS PC, even with no phone open. After 20 seconds of the exact same frame from a camera that was moving, it reselects that camera's NDI source, at most once a minute. It never moves a camera or changes scenes.</div>`:""}
    <div class="sl">${ICON.info}About</div>
    <div class="list">
      <div class="row"><span class="grow">OBS Remote</span><span class="v">${esc(u?.version||"")}</span></div>
      ${S.obsVersion?`<div class="row"><span class="grow">OBS Studio</span><span class="v">${esc(S.obsVersion)}</span></div>`:""}
      ${u&&!upd?`<button class="row" id="sCheck"><span class="grow">${u.update&&u.blocked?esc(u.latest)+" is available<small>"+esc(u.blocked)+"</small>":u.latest?"Up to date":"Couldn't check for updates<small>Is the OBS PC online?</small>"}</span><span class="v">Check now</span></button>`:""}
    </div>`,{bind:el=>{
    $("sConn").onclick=()=>openConnection(false);
    el.querySelectorAll(".seg").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;buzz();
      g.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));const k=g.dataset.set;S[k]=b.dataset.v;store.set(k,S[k]);
      if(k==="quality")$("qNote").textContent=QNOTE[S.quality];else{stopMove();applyCtrl()}}));
    if($("sStudio"))$("sStudio").onchange=e=>{buzz();obs.call("SetStudioModeEnabled",{studioModeEnabled:e.target.checked}).then(()=>toast(e.target.checked?"Studio Mode on in OBS":"Studio Mode off in OBS")).catch(fail)};
    if($("sUpdate"))$("sUpdate").onclick=confirmUpdate;
    if($("sCheck"))$("sCheck").onclick=async()=>{const b=$("sCheck");b.disabled=true;b.querySelector(".v").textContent="Checking…";
      await checkUpdate(true);if(S.upd&&!S.upd.update&&S.upd.latest)toast(`You have the latest version (${S.upd.version}).`);openSettings()};
    loadAutofix()}})}
// Fix frozen NDI cameras (runs in server.py, see autofix.py). Shown only when that server answers.
const APPSET={realm:"OBS_WEBSOCKET_DATA_REALM_PROFILE",slotName:"obs-remote.settings"};
async function loadAutofix(){
  if(!$("sFix"))return;
  let a;try{const r=await fetch("/api/autofix",{cache:"no-store"});if(!r.ok)return;a=await r.json()}catch{return}
  if(!$("sFix"))return;
  const t=x=>new Date(x*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const today=a.events.filter(e=>new Date(e.t*1000).toDateString()===new Date().toDateString());
  const last=a.events[a.events.length-1];
  $("sFixInfo").textContent=!a.enabled?"Off":!a.running?`Not running: ${a.error||"can't reach OBS"}`
    :!a.watching.length?"No NDI cameras to watch."
    :`Watching ${a.watching.join(", ")}.`+(last?` Last fix: ${last.source} at ${t(last.t)} (${today.length} today).`:" No freezes so far.");
  $("sFix").checked=!!a.enabled;$("sFixRow").hidden=$("sFixFoot").hidden=false;
  $("sFix").onchange=e=>{buzz();obs.call("SetPersistentData",{...APPSET,slotValue:{autofix:e.target.checked}})
    .then(()=>{toast(e.target.checked?"Fixing frozen cameras":"Not fixing frozen cameras");setTimeout(loadAutofix,1500)}).catch(fail)}}

/* Connection: who you're connected to; scanning the setup window's QR code is the easy way in.
   forced = no password yet, or the saved one was refused: this page stays until a connection works. */
let forced=false;
function openConnection(force){
  if(force)forced=true;
  const layer=forced?"pg1":"pg2",open=forced||!obs.ready;
  page(layer,"connection","Connection",`
    ${obs.ready?`<div class="list" style="margin-top:14px"><div class="row"><span class="cdot"></span><span class="grow">Connected<small>${esc(S.collection||"OBS")} · ${esc(cfg.host)} · ${viaText()}</small></span></div></div>`:""}
    <div class="sl">${forced?"Connect to OBS":"Connect to another PC"}</div>
    <div class="list"><div class="qr">${ICON.qr}<p><b>Scan the code on the PC</b>Open OBS Remote on the OBS PC. Point this phone's camera at the QR code in its window.</p></div></div>
    <details class="hand"${open?" open":""}><summary>Enter the details by hand</summary>
      <div class="list flist">
        <div class="field"><label for="cHost">OBS PC address</label><input id="cHost" value="${esc(cfg.host)}" inputmode="url" autocapitalize="off" autocomplete="off"></div>
        <div class="field"><label for="cPort">Port</label><input id="cPort" value="${esc(cfg.port)}" inputmode="numeric"></div>
        <div class="field"><label for="cPw">Password</label><input id="cPw" type="password" value="${esc(cfg.pw)}" autocomplete="current-password"></div>
      </div>
      <div class="foot">The password is in OBS, under Tools › WebSocket Server Settings.</div>
      <button class="wide" id="cGo">Connect</button>
    </details>`,{back:!forced,bind:()=>{
    $("cGo").onclick=()=>{buzz();
      cfg.host=$("cHost").value.trim()||cfg.host;cfg.port=+$("cPort").value||4455;cfg.pw=$("cPw").value;
      store.set("host",cfg.host);store.set("port",cfg.port);store.set("pw",cfg.pw);
      // Close the page straight away, as the old Save & connect did: if OBS turns out to be closed, the Start OBS
      // offer underneath must be visible. A wrong password brings this page back (connect → openConnection(true)).
      forced=false;["pg1","pg2"].forEach(id=>{if(pageState[id]==="connection")closePage(id)});
      $("imgCam").removeAttribute("src");toast("Connecting to "+cfg.host+"…");obs.close();retry=0;connect()}}})}
function closeForced(){if(!forced)return;forced=false;closePage("pg1");$("pg2").classList.remove("show");pageState.pg2=null}

/* Scenes: one list with search. Tap a row to use it; star it to make it a key on the Switcher. */
function openScenes(){
  const nf=S.scenes.filter(n=>S.fav.has(n)).length,typed=pageState.pg2==="scenes"?$("find")?.value||"":"";
  page("pg2","scenes","Scenes",`<input class="find" id="find" placeholder="Find a scene" autocomplete="off" aria-label="Find a scene">
    <div class="list" id="allList">${S.scenes.map(n=>{const c=n===S.program?"pgm":n===S.preview?"pvw":"",f=S.fav.has(n);
      return `<div class="srow ${c}" data-name="${esc(n.toLowerCase())}"><button class="suse" data-use="${esc(n)}"><span class="sth"><img data-th="${esc(n)}" alt=""${S.sthumbs[n]?` src="${S.sthumbs[n]}"`:""}></span><span class="grow">${esc(n)}${c?`<small>${c==="pgm"?"On air":"In preview"}</small>`:""}</span></button><button class="star${f?" on":""}" data-star="${esc(n)}" aria-label="Favourite ${esc(n)}" aria-pressed="${f}">${f?ICON.starOn:ICON.star}</button></div>`}).join("")}</div>
    <div class="foot">${nf?`${nf} starred: only these are keys on the Switcher, plus whatever is on air or in preview. Saved in OBS for every phone.`:"Nothing starred: every scene is a key on the Switcher. Star a few to keep it short. Saved in OBS for every phone."}</div>`,
  {act:nf?`<button class="act" id="clearFav">Clear stars</button>`:"",bind:el=>{
    const q=$("find");q.oninput=()=>{const s=q.value.toLowerCase();el.querySelectorAll(".srow").forEach(r=>r.hidden=!r.dataset.name.includes(s))};
    if(typed){q.value=typed;q.oninput()}
    if($("clearFav"))$("clearFav").onclick=()=>{buzz();S.fav.clear();saveFavs();renderScenes();openScenes()};
    $("allList").onclick=e=>{const u=e.target.closest("[data-use]"),f=e.target.closest("[data-star]");
      if(f){buzz();const n=f.dataset.star;S.fav.has(n)?S.fav.delete(n):S.fav.add(n);saveFavs();renderScenes();
        openScenes();return}
      if(u){closePage("pg2");useScene(u.dataset.use)}}}});
  // thumbnails for rows that don't have one yet
  (async()=>{for(const n of S.scenes){if(pageState.pg2!=="scenes")break;if(!S.sthumbs[n])await sceneThumb(n)}})()}

/* ---------- self-update ----------
   server.py compares its VERSION with the one on GitHub and, on request, downloads main and restarts itself.
   OBS isn't touched. A page served some other way has no /api and nothing about updates shows. */
S.upd=null;
async function checkUpdate(fresh){  // fresh: ask GitHub now instead of the server's 10-minute cache
  try{const r=await fetch("/api/version"+(fresh?"?fresh=1":""),{cache:"no-store"});S.upd=r.ok?await r.json():null}catch{S.upd=null}
  $("btnMore").classList.toggle("badge",!!(S.upd?.update&&!S.upd.blocked))}
function confirmUpdate(){const u=S.upd;if(!u)return;
  // release notes (GitHub markdown, shown as plain text) above the usual explanation
  const notes=(u.notes||"").replace(/\r/g,"").replace(/^#+\s*/gm,"").replace(/\*\*|__|`/g,"").trim();
  confirmSheet(`Update to ${u.latest}?`,
    (notes?(notes.length>600?notes.slice(0,600)+"…":notes)+"\n\n":"")+
    "The OBS PC downloads the new version from GitHub and restarts the app's web server. OBS itself keeps running. Phones reload in a few seconds.",
    "Update",false,runUpdate)}
async function runUpdate(){
  toast("Updating…");
  let j={};try{const r=await fetch("/api/update",{method:"POST",headers:{"X-OBS-Remote":"1"}});j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Update failed")}
  catch(e){toast(e.message||"Update failed",true);return}
  toast(`Updated to ${j.version}. Reloading…`);
  for(let i=0;i<90;i++){await sleep(1000); // wait for the restarted server, then load the new page
    try{const v=await (await fetch("/api/version",{cache:"no-store"})).json();if(v.version===j.version){location.reload();return}}catch{}}
  toast("The app server didn't come back. On the OBS PC, open OBS Remote from the Start menu.",true)}
checkUpdate();setInterval(checkUpdate,6*3600e3);
obs.on("open",()=>obs.call("GetVersion").then(v=>{S.obsVersion=v.obsVersion}).catch(()=>{}));

/* ---------- go ---------- */
renderOutputs();renderScenes();renderAudio();renderCams();
if(!cfg.pw){setConn("err","Not connected");openConnection(true)}else connect();
shotLoop();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!obs.ready&&cfg.pw){clearTimeout(retryT);retry=0;connect()}else if(!document.hidden&&obs.ready)loadAll()});
</script>
